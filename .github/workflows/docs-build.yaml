---
name: docs-build

# Builds the homelab docs site (docs/site over docs/homelab) into a container image
# and pushes it to GHCR. The gitops repo otherwise only references external images;
# this is the one image it builds. On PRs it builds without pushing (validation only).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - cluster/**
      - .github/workflows/docs-build.yaml
  pull_request:
    paths:
      - docs/**
      - cluster/**
      - .github/workflows/docs-build.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/site/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/arsenikki/homelab-docs:latest
            ghcr.io/arsenikki/homelab-docs:git-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
