---
# Validates the Talos machine config on every PR that touches it, WITHOUT real
# secrets: the repo is public, so this runs on GitHub-hosted runners against a copy
# of infra/talos with a throwaway secrets bundle. It renders every node with topf
# and checks each config with `talosctl validate --mode metal`. Catches malformed
# patches, schema errors and missing install disks before merge. It cannot see
# live drift: that needs `task talos:diff` against the nodes.
name: Talos validate
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    paths:
      - infra/talos/**
      - .mise.toml
      - mise.lock
      - .github/workflows/talos-validate.yaml
permissions:
  contents: read
jobs:
  talos-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned topf + talosctl (versions from .mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
      - name: Install and resolve tool paths
        run: |
          mise install "github:postfinance/topf" talosctl
          # Absolute paths: later steps run outside the repo, where mise has no config.
          echo "TOPF=$(mise which topf)" >> "$GITHUB_ENV"
          echo "TALOSCTL=$(mise which talosctl)" >> "$GITHUB_ENV"
      - name: Render every node with throwaway secrets
        run: |
          work="$RUNNER_TEMP/talos"
          cp -r infra/talos "$work"
          # Outside the repo there is no .sops.yaml, so topf writes a plaintext
          # throwaway bundle instead of trying to decrypt the real one.
          rm -f "$work/secrets.yaml"
          cd "$work"
          "$TOPF" secrets --confirm=false > /dev/null
          "$TOPF" render -o "$RUNNER_TEMP/rendered"
      - name: talosctl validate (metal)
        run: |
          rc=0
          for f in "$RUNNER_TEMP"/rendered/*.yaml; do
            if "$TALOSCTL" validate --mode metal --config "$f"; then
              echo "ok      $(basename "$f")"
            else
              echo "::error::$(basename "$f" .yaml): invalid Talos machine config"
              rc=1
            fi
          done
          exit $rc
