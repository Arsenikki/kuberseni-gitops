name: Image check
# Fail a PR that points a workload at an image tag that doesn't exist in its registry.
# #788 merged a bump to paseo-homelab:0.11.2-11 whose build never ran (Actions blocked),
# leaving paseo-generic in ImagePullBackOff for ~22h. Checks only images on ADDED lines
# of the PR diff (inline `image: repo:tag` refs; helm repository/tag splits are skipped).
on: # yamllint disable-line rule:truthy
  pull_request:
    paths: ['cluster/**']
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Private ghcr.io/arsenikki packages need a token with read:packages
      # (repo secret GHCR_READ_TOKEN); public images resolve anonymously.
      - name: Log in to ghcr.io
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        if: env.GHCR_READ_TOKEN != ''
        run: echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      # An unreadable image still fails: a private tag we can't verify is exactly how
      # #788 slipped through. The message just says WHY, so a missing secret isn't
      # mistaken for a missing tag.
      - name: Check added image refs exist
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HAVE_GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN != '' }}
        run: |
          imgs=$(git diff "$BASE"...HEAD -- 'cluster/**.yaml' 'cluster/**.yml' \
            | grep -E '^\+[^+].*[[:space:]{,]image:[[:space:]]*[^[:space:]]' \
            | sed -E "s/.*image:[[:space:]]*[\"']?([^\"' ,}#]+).*/\1/" \
            | sort -u)
          if [ -z "$imgs" ]; then echo "no image refs changed"; exit 0; fi
          fail=0
          for img in $imgs; do
            if err=$(docker buildx imagetools inspect "$img" 2>&1 >/dev/null); then
              echo "ok      $img"
              continue
            fi
            fail=1
            reason=$(printf '%s\n' "$err" | grep -m1 . | cut -c1-300)
            if printf '%s' "$err" | grep -qiE 'not found|manifest unknown'; then
              echo "::error::image tag does not exist: $img"
            elif printf '%s' "$err" | grep -qiE '401|403|unauthori[sz]ed|denied|forbidden'; then
              case "$img" in
                ghcr.io/*)
                  if [ "$HAVE_GHCR_TOKEN" = true ]; then
                    echo "::error::cannot read $img with GHCR_READ_TOKEN (token lacks read:packages or access to this package?): $reason"
                  else
                    echo "::error::cannot verify $img: it is private and the GHCR_READ_TOKEN repo secret is not set (token with read:packages). The tag may well exist; this check can't tell."
                  fi ;;
                *) echo "::error::cannot read $img (private registry, no credentials here): $reason" ;;
              esac
            else
              echo "::error::could not inspect $img: $reason"
            fi
          done
          exit $fail
