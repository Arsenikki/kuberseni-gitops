# Jeeves per-repo policy. Replaces this repo's entry in the old central repos.yaml
# (removed in jeeves#175 — the GitHub App installation is now the access boundary and
# per-repo policy lives with the repo). Declares the quality gate only — whether Jeeves may
# auto-merge is the board project's `autoMerge` setting, not this file.
pre_commit_tool: prek
pre_commit: prek.toml
# Both gh checks must be green before an auto-merge.
required_checks: ["yaml", "Render ArgoCD diff"]
verify:
  - { name: yamllint, cmd: "yamllint -c .github/yamllint.config.yaml ./cluster/", required: true }
# No no_automerge_paths: cluster/** stays advisor-judged so routine Renovate bumps keep
# auto-merging, while the review advisor holds genuinely high-blast-radius infra.
