---
# digests: daily personal AI digest (Gmail, Calendar, Tasks, news) written to the
# Arsenikki/daily-digests (Obsidian vault) and pushed to Telegram. Source: https://github.com/Arsenikki/digests
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kuberseni
  source:
    repoURL: https://github.com/Arsenikki/kuberseni-gitops
    targetRevision: main
    path: cluster/apps/digests
  destination:
    server: https://kubernetes.default.svc
    namespace: digests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
