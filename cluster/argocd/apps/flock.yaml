---
# flock — the Jeeves board (`jeeves board`): the realtime kanban board that is
# Jeeves' ticket surface, shared by the jeeves + jeeves-dev instances. Formerly the
# separate Arsenikki/flock repo; its source + deploy manifests now live in the
# (private) jeeves repo under deploy/board. The Application, namespace, StatefulSet
# and PVC keep the `flock` name on purpose — renaming would orphan the SQLite PVC.
# NEVER delete/rename this Application: its finalizer + prune would take the
# board data with it. Isolated/additive: its
# own namespace `flock` and its own ingress host jeeves.arsenikki.casa. No auth in
# v1 (private LAN/Tailscale only; authentik SSO is a planned follow-up). Wave 6 —
# after ESO/1Password + Longhorn, like jeeves.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flock
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    # The source repo is PRIVATE, so the in-CI "Render ArgoCD diff" preview (an
    # ephemeral ArgoCD with no repo creds) cannot list its refs and fails the
    # check. Skip this app in the preview; the live cluster's ArgoCD has the
    # repo credential (flock-repo ExternalSecret) and renders it normally.
    argocd-diff-preview/ignore: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kuberseni
  source:
    repoURL: https://github.com/Arsenikki/jeeves
    targetRevision: main
    path: deploy/board
  destination:
    server: https://kubernetes.default.svc
    namespace: flock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
