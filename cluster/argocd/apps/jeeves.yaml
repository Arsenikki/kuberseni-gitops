---
# jeeves (PROD) — ticket-driven autonomous maintenance: board cards -> reviewed
# PRs, built with Paseo + Claude Code. Deployed from the private `jeeves` Helm chart
# (templates + agent prompts ship in the chart; values in cluster/apps/jeeves/).
# The PROMOTED channel: Renovate opens a PR for each release and merging it is the
# promotion (soak it on jeeves-dev first). Wave 6 — after ESO/1Password (secrets)
# and Longhorn (NATS PVC). See cluster/apps/jeeves/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jeeves
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    # The chart is PRIVATE, so the in-CI "Render ArgoCD diff" preview (an
    # ephemeral ArgoCD with no registry creds) can't pull it. Skip this app there;
    # the live ArgoCD has the arsenikki-charts OCI repository credential.
    argocd-diff-preview/ignore: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kuberseni
  sources:
    # Private OCI chart published by every jeeves release (no oci:// prefix).
    # Chart X.Y.Z runs image vX.Y.Z. Renovate bumps targetRevision.
    - repoURL: ghcr.io/arsenikki/charts
      chart: jeeves
      targetRevision: 1.62.0
      helm:
        releaseName: jeeves
        valueFiles:
          - $values/cluster/apps/jeeves/values-prod.yaml
    - repoURL: https://github.com/Arsenikki/kuberseni-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jeeves-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Auto-sync doesn't re-attempt a failed sync of the same commit; retry rides
    # out transient OCI pull failures.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
