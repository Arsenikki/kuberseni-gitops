---
# Node-RED was retired (automations moved to Home Assistant packages, see
# cluster/apps/home-automation/home-assistant/packages/). These entries make
# Authentik DELETE the application and provider; drop this file (and its
# metaapplyblueprint in embedded-outpost.yaml) once that has been applied.
version: 1
metadata:
  name: &app nodered
entries:
  - id: application
    model: authentik_core.application
    state: absent
    identifiers:
      slug: *app

  - id: provider
    model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: *app
