---
global:
  # Give Authentik high scheduling priority so it is placed first and can
  # preempt non-essential pods under node pressure. In the 2026-08-31 power-cut
  # incident Authentik (BestEffort, no requests) got starved off a wedged node
  # and every SSO-protected app 500'd. Propagates to server + worker.
  priorityClassName: kuberseni-critical
  # Non-secret PostgreSQL connection params must be set explicitly when using existingSecret
  # (chart skips auto-configuring them in that mode)
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "authentik-postgresql"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__USER
      value: "authentik"

authentik:
  # All secret env vars injected from authentik-secrets k8s Secret (created by ExternalSecret).
  # Secret must contain: AUTHENTIK_SECRET_KEY, AUTHENTIK_BOOTSTRAP_TOKEN,
  # AUTHENTIK_BOOTSTRAP_PASSWORD, AUTHENTIK_POSTGRESQL__PASSWORD
  existingSecret:
    secretName: authentik-secrets
  log_level: info

blueprints:
  configMaps:
    - authentik-blueprints

server:
  # Requests move the server from BestEffort to Burstable QoS so the scheduler
  # accounts for it and it is not the first pod starved/evicted under pressure.
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
  ingress:
    enabled: true
    hosts:
      - authentik.arsenikki.casa
    annotations:
      kubernetes.io/tls-acme: "true"
      external-dns/is-public: "true"
    tls:
      - secretName: authentik-tls
        hosts:
          - authentik.arsenikki.casa

worker:
  # Burstable QoS + accounted requests (see server.resources rationale).
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
  podAnnotations:
    configmap.reloader.stakater.com/reload: "authentik-blueprints"

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-secrets
    secretKeys:
      adminPasswordKey: AUTHENTIK_POSTGRES_PASSWORD
      userPasswordKey: AUTHENTIK_POSTGRES_PASSWORD

redis:
  enabled: true
