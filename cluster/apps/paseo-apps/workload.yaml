---
# paseo-apps — the shared Paseo daemon for the homelab app agents (resepti, coachi,
# untappi, …). Built from the portable `paseo-homelab` image (paseo 0.11.x + Claude
# Code + Antigravity/agy). Apps drive it over the paseo CLI pointed at the
# `paseo-apps` service; each app runs agents in its own workspace + MCP.
#
# Providers: `claude` (CLAUDE_CODE_OAUTH_TOKEN, work token) for MCP-tool agents;
# `antigravity` (AI Pro) once AGY_TOKEN_JSON is seeded (optional — see secrets.yaml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paseo-apps
  namespace: paseo-apps
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  serviceName: paseo-apps
  replicas: 1
  selector:
    matchLabels:
      app: paseo-apps
  template:
    metadata:
      labels:
        app: paseo-apps
        app.kubernetes.io/part-of: paseo-homelab
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: paseo
          image: ghcr.io/arsenikki/paseo-homelab:0.11.2-3
          imagePullPolicy: Always
          env:
            - name: PASEO_HOME
              value: /data/paseo
            # Claude Code auth (claude provider) — reuse the shared work token.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: CLAUDE_CODE_OAUTH_TOKEN
            # Daemon bearer auth. The 0.11.2 daemon bcrypts PASEO_PASSWORD from env
            # (env takes precedence over any persisted hash), so this alone enables
            # auth — no entrypoint/image change. Every client (resepti-api) must send
            # the same value; both read it from the paseo-apps-password 1Password item.
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: PASEO_PASSWORD
            # AI-Pro (agy/antigravity) token file, seeded by the entrypoint.
            # Optional: the daemon runs without it (claude only) until it's seeded.
            - name: AGY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-agy
                  key: AGY_TOKEN
                  optional: true
            # resepti workspace: the cross-namespace URL its .mcp.json resolves.
            # The entrypoint also registers this as a native agy MCP server
            # (RESEPTI_MCP_URL -> `resepti`) so antigravity agents get real tools.
            - name: RESEPTI_MCP_URL
              value: http://resepti-mcp.resepti.svc.cluster.local:9090
            # Lock agy to --sandbox on this shared app instance: untrusted-input app
            # agents (e.g. the resepti importer) get MCP + WebFetch but no arbitrary
            # shell/exec. (paseo-generic leaves this unset so its debug shell is full.)
            - name: AGY_FORCE_SANDBOX
              value: "1"
            # Daemon Host-header allowlist: the 0.11.x daemon 403s a TCP client whose
            # Host isn't listed. This is a SEPARATE layer from the PASEO_PASSWORD bearer
            # auth above — a client must satisfy BOTH (allow-listed Host AND password).
            # In-cluster apps dial the Service FQDN, so it must be allowed. The
            # entrypoint also adds loopback + the pod hostname automatically.
            # In-cluster apps dial the Service FQDN; paseo-apps.arsenikki.casa is the
            # ingress host for manual (tailnet) access. The entrypoint also adds loopback
            # + the pod hostname automatically.
            - name: PASEO_HOSTNAMES
              value: "paseo-apps.paseo-apps.svc.cluster.local,paseo-apps,paseo-apps.paseo-apps,paseo-apps.arsenikki.casa"
          ports:
            - containerPort: 6767
              name: paseo
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # agy/antigravity agents are memory-heavy (the agy.real binary alone is
            # ~214MB resident + node runtime + model/streaming context on top of the
            # paseo daemon). 1Gi OOMKilled the pod under agent load; 3Gi gives a single
            # agent comfortable headroom and room for a 2nd concurrent agent once
            # another app shares this instance. Worker nodes have 16-20Gi (vms.tf).
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data/paseo
            # resepti agent workspace (read-only, from the resepti-workspace ConfigMap)
            - name: resepti-workspace
              mountPath: /workspaces/resepti/.mcp.json
              subPath: mcp.json
              readOnly: true
            - name: resepti-workspace
              mountPath: /workspaces/resepti/CLAUDE.md
              subPath: CLAUDE.md
              readOnly: true
            - name: resepti-workspace
              mountPath: /workspaces/resepti/GEMINI.md
              subPath: GEMINI.md
              readOnly: true
            - name: resepti-workspace
              mountPath: /workspaces/resepti/.claude/settings.json
              subPath: settings.json
              readOnly: true
      volumes:
        - name: resepti-workspace
          configMap:
            name: resepti-workspace
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paseo-apps
  namespace: paseo-apps
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  type: ClusterIP
  selector:
    app: paseo-apps
  ports:
    - name: paseo
      port: 6767
      targetPort: 6767
