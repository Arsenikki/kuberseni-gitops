  mcp.json: |
    {
      "mcpServers": {
        "resepti": {
          "type": "http",
          "url": "${RESEPTI_MCP_URL}"
        }
      }
    }
  settings.json: |
    {
      "enableAllProjectMcpServers": true,
      "permissions": {
        "allow": ["mcp__resepti", "WebFetch"],
        "deny": ["Bash", "Edit", "Write", "WebSearch"]
      }
    }
kind: ConfigMap
metadata:
  name: resepti-workspace
  namespace: paseo-apps
  labels:
    app.kubernetes.io/part-of: paseo-homelab
