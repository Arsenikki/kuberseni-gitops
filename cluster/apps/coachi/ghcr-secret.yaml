---
# GHCR image-pull secret — lets the cluster pull the PRIVATE coachi images
# (ghcr.io/arsenikki/coachi + coachi-paseo). ESO renders a dockerconfigjson from
# the shared 1Password `github-packages-ro` item (a long-lived read:packages PAT),
# so rotating that one item fixes every consumer at once. Referenced by
# imagePullSecrets on the coachi-mcp / coachi-paseo / coachi-api workloads.
#
# NOTE: previously sourced from the `coachi` item's ghcr_username/ghcr_pat fields,
# but that PAT expired (2026-09-15) and took coaching down. Pointing at the
# dedicated `github-packages-ro` item avoids per-app token duplication/expiry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: coachi
  labels:
    app.kubernetes.io/part-of: coachi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"arsenikki","password":"{{ .ghcr_pat }}","auth":"{{ printf `arsenikki:%s` .ghcr_pat | b64enc }}"}}}'
  data:
    - secretKey: ghcr_pat
      remoteRef:
        key: "github-packages-ro"
        property: credential
