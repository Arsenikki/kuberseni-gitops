---
# GHCR image-pull secret — lets the cluster pull the PRIVATE coachi images
# (ghcr.io/arsenikki/coachi + coachi-paseo). ESO renders a dockerconfigjson from
# the 1Password `coachi` item fields ghcr_username + ghcr_pat (a PAT with
# read:packages). Referenced by imagePullSecrets on the coachi-mcp / coachi-paseo
# / coachi-api workloads. Same pattern as captain-core.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: coachi
  labels:
    app.kubernetes.io/part-of: coachi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .ghcr_username }}","password":"{{ .ghcr_pat }}","auth":"{{ printf `%s:%s` .ghcr_username .ghcr_pat | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: "coachi"
        property: ghcr_username
    - secretKey: ghcr_pat
      remoteRef:
        key: "coachi"
        property: ghcr_pat
