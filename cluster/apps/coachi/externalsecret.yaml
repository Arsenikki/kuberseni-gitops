---
# Pulls the Postgres password, the Claude credential (for the Paseo daemon's
# coaching agents), the Freddy MCP token, and Telegram delivery creds from
# 1Password (vault "homelab") via the `onepassword` ClusterSecretStore into one
# Kubernetes secret `coachi-secrets`.
#
# 1Password item required in the homelab vault — create item "coachi" with fields:
#   - postgres_password        (any strong value; also used by the db + api + mcp)
#   - claude_code_oauth_token  (same Claude credential jeeves uses; copy it)
#   - freddy_token             (permanent token from freddy.coach; the /mcp/<token> tail)
#   - telegram_bot_token       (BotFather token — ROTATE the one leaked earlier)
#   - telegram_chat_id         (target chat/group id)
#
# Freddy/Telegram fields may be left empty in 1Password if unused — the app
# degrades gracefully (no Freddy MCP data / no Telegram delivery).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coachi-secrets
  namespace: coachi
  labels:
    app.kubernetes.io/part-of: coachi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: coachi-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "coachi"
        property: postgres_password
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: "coachi"
        property: claude_code_oauth_token
    - secretKey: FREDDY_TOKEN
      remoteRef:
        key: "coachi"
        property: freddy_token
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: "coachi"
        property: telegram_bot_token
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: "coachi"
        property: telegram_chat_id
    # SeaweedFS S3 creds (shared observability store) for media uploads.
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: secret_key
