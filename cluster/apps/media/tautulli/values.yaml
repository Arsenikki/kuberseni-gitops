---
controllers:
  main:
    annotations:
      # app-template >=2 adds app.kubernetes.io/controller to the (immutable)
      # selector, so the Deployment must be deleted and recreated once.
      # TODO: drop this annotation once the 5.x rollout has synced.
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/tautulli
          tag: 2.17.1
        env:
          TZ: Europe/London
        probes:
          liveness: &probes
            enabled: true
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi

defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    controller: main
    ports:
      http:
        port: 8181

ingress:
  main:
    annotations:
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
    hosts:
      - host: tautulli.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - secretName: tautulli-tls
        hosts:
          - tautulli.arsenikki.casa

persistence:
  config:
    existingClaim: tautulli-config
