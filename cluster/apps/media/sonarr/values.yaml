---
controllers:
  main:
    annotations:
      # app-template >=2 adds app.kubernetes.io/controller to the (immutable)
      # selector, so the Deployment must be deleted and recreated once.
      # TODO: drop this annotation once the 5.x rollout has synced.
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/sonarr
          tag: 4.0.17.2967
        env:
          TZ: Europe/London
          SONARR__AUTH__METHOD: External
          SONARR__AUTH__REQUIRED: Enabled
          SONARR__LOG__LEVEL: info
        probes:
          liveness: &probes
            enabled: true
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256M
          limits:
            memory: 1024M

defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"
    supplementalGroups: [10000]

service:
  main:
    controller: main
    ports:
      http:
        port: 8989

ingress:
  main:
    annotations:
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
    hosts:
      - host: sonarr.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - secretName: sonarr-tls
        hosts:
          - sonarr.arsenikki.casa

persistence:
  config:
    existingClaim: sonarr-config
  media:
    existingClaim: media-pvc
    globalMounts:
      - path: /data
