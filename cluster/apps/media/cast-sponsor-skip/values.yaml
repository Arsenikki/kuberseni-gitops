---
controllers:
  main:
    annotations:
      # app-template 4.x renamed the (immutable) selector label
      # app.kubernetes.io/component -> app.kubernetes.io/controller, so the
      # Deployment must be deleted and recreated once.
      # TODO: drop this annotation once the 5.x rollout has synced.
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    containers:
      main:
        image:
          repository: ghcr.io/gabe565/castsponsorskip
          tag: 0.8.3
        env:
          TZ: "Europe/London"
          # YouTube API key injected from ESO → cast-sponsor-skip-secret
          CSS_YOUTUBE_API_KEY:
            valueFrom:
              secretKeyRef:
                name: cast-sponsor-skip-secret
                key: YOUTUBE_API_KEY
    strategy: RollingUpdate
    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
