---
# Credential-encryption key for BookBridge (encrypts the stored ABS API token
# and per-user KOReader/kosync passwords held in /data/database.db).
# 1Password item: "BookBridge" (vault: homelab)
#   field: secret_key  -> a long random string (e.g. `openssl rand -hex 32`)
# Back this up together with the bookbridge-data PVC; losing the key means
# re-entering every stored credential in the UI.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookbridge-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bookbridge-secret
    creationPolicy: Owner
  data:
    - secretKey: BOOKBRIDGE_SECRET_KEY
      remoteRef:
        key: "BookBridge"
        property: secret_key
