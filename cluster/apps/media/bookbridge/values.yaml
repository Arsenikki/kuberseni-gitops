---
image:
  repository: ghcr.io/cporcellijr/bookbridge
  tag: v7.6.0

env:
  TZ: Europe/London
  LOG_LEVEL: INFO
  # BookBridge IS the KOReader kosync server (point KOReader here). Leave
  # KOSYNC_SERVER empty to use the built-in endpoint rather than relaying out.
  KOSYNC_ENABLED: "true"
  # Whisper forced-alignment runs locally on CPU (tiny model) — no GPU node.
  WHISPER_DEVICE: cpu

# BOOKBRIDGE_SECRET_KEY encrypts the stored ABS token / KOReader creds.
# Sourced from 1Password via ESO. optional:true so the pod boots even before
# the item exists — BookBridge then falls back to an auto-generated
# /data/secret.key on the persistent volume. Set the item, then restart.
envFrom:
  - secretRef:
      name: bookbridge-secret
      optional: true

service:
  main:
    ports:
      http:
        port: 5757

ingress:
  main:
    enabled: true
    ingressClassName: traefik
    # No authentik-forward-auth: KOReader's kosync client is non-interactive and
    # cannot pass an SSO login page. BookBridge has its own admin login + per-user
    # kosync credentials. (If you ever want the dashboard behind SSO, enable
    # split-port mode with KOSYNC_PORT=5758 and expose only that path un-SSO'd.)
    annotations:
      kubernetes.io/tls-acme: "true"
    hosts:
      - host: bookbridge.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: bookbridge-tls
        hosts:
          - bookbridge.arsenikki.casa

# SQLite DB in /data is single-writer — one replica, Recreate.
controller:
  strategy: Recreate

podSecurityContext:
  runAsUser: 568
  runAsGroup: 568
  fsGroup: 568
  fsGroupChangePolicy: "OnRootMismatch"
  supplementalGroups: [10000]

persistence:
  # DB, secret.key, transcripts, audio_cache. MUST be a real RWO filesystem
  # (Longhorn), never NFS — SQLite locking breaks over NFS.
  data:
    enabled: true
    mountPath: /data
    existingClaim: bookbridge-data
  # EPUB library, scoped to the same existing `books` subfolder, read-only.
  # Invisible to the rest of media-pvc; BookBridge can also source ebooks
  # straight from ABS, so this is just for on-disk EPUB access.
  books:
    enabled: true
    mountPath: /books
    existingClaim: media-pvc
    subPath: books
    readOnly: true

resources:
  requests:
    cpu: 50m
    memory: 256M
  limits:
    # Headroom for the one-time Whisper transcription pass per book.
    memory: 2Gi
