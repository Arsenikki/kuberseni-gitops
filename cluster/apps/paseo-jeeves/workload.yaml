---
# paseo-jeeves — the THIRD paseo tier: Jeeves's autonomous full-shell coding daemon.
#
# The homelab runs three paseo tiers, split by the agent's capability + trust profile
# (NOT by which app it is — see docs/homelab/paseo.md):
#   1. paseo-apps     — shared, SANDBOXED, MCP-only tool agents (resepti, coachi,
#                       untappi, …). One boring daemon for all data/domain apps.
#   2. paseo-jeeves   — THIS: full shell + git worktrees + daemon password + GitHub
#                       App token-broker. The autonomous code-maintenance agent.
#   3. paseo-generic  — interactive personal/debug (you), full shell + cluster-read.
#
# Jeeves gets its own tier because its coding agents are the opposite of the sandboxed
# app agents: they edit files, run builds/tests, and git commit/push across many repos.
# Three containers (mirror the jeeves repo deploy/base/paseo.yaml, #68 PEM isolation):
#   - paseo        : the 0.11.x daemon that runs Claude Code agents in worktrees
#   - token-broker : holds the App private key, mints short-lived tokens on a unix
#                    socket, so the durable key NEVER enters the agent container
#   - repo-sync    : keeps base clones of the managed repos on the PVC for worktrees
#
# Both the prod and dev Jeeves instances' agent-runners connect to this one daemon
# (agents are isolated by per-instance labels). Blast-radius: deliberately NO homelab
# infra creds and NO cluster-reader SA here — infra-investigation tickets are not run
# on this daemon; automountServiceAccountToken:false keeps the pod API-identity-free.
apiVersion: v1
kind: Service
metadata:
  name: paseo-jeeves
  namespace: paseo-jeeves
  labels:
    app: paseo-jeeves
    app.kubernetes.io/part-of: paseo-homelab
spec:
  type: ClusterIP
  selector:
    app: paseo-jeeves
  ports:
    - name: daemon
      port: 6767
      targetPort: 6767
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paseo-jeeves
  namespace: paseo-jeeves
  labels:
    app: paseo-jeeves
    app.kubernetes.io/part-of: paseo-homelab
spec:
  serviceName: paseo-jeeves
  replicas: 1 # singleton daemon — do not scale
  selector:
    matchLabels:
      app: paseo-jeeves
  template:
    metadata:
      labels:
        app: paseo-jeeves
        app.kubernetes.io/part-of: paseo-homelab
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      automountServiceAccountToken: false # no in-pod k8s API identity (no infra access here)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000 # make the PVC writable by uid 1000 (all containers)
        fsGroupChangePolicy: OnRootMismatch # skip the recursive chown when the PVC root already matches (fast rolls; the data PVC has ~20k+ files)
      # Soft-spread the Paseo daemons (paseo-apps/generic/jeeves) across workers: they
      # are the heaviest pods and two had landed on 3-vCPU worker-02. Soft because there
      # are 3 daemons (RWO PVCs) on 2 workers.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector: {}
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: paseo-homelab
      initContainers:
        # The shared paseo-homelab image carries no `jeeves` binary. Copy it from the
        # sidecar image (same jeeves:v1.49.0 tag the token-broker runs) into a shared
        # /opt/bin on PATH, so git's `!jeeves git-credential` helper resolves in the
        # daemon container. Keeps the shared image free of jeeves-specific code.
        - name: inject-jeeves-bin
          image: ghcr.io/arsenikki/jeeves:v1.49.0
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","cp /usr/local/bin/jeeves /opt/bin/jeeves && chmod 0755 /opt/bin/jeeves"]
          volumeMounts:
            - { name: jeeves-bin, mountPath: /opt/bin }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        # The Paseo 0.11.x daemon (runs Claude Code + Antigravity agents in worktrees). Now the SHARED
        # paseo-homelab image (same as paseo-apps/paseo-generic) — gains agy + newer
        # claude-code + the baked Go toolchain + procps/lbzip2; the jeeves binary is injected above and
        # git auth is wired via the generic $GIT_CREDENTIAL_HELPER entrypoint hook.
        - name: paseo
          image: ghcr.io/arsenikki/paseo-homelab:0.11.2-12
          imagePullPolicy: Always
          ports:
            - { containerPort: 6767, name: daemon }
          envFrom:
            - secretRef: { name: jeeves-gh-app, optional: true } # GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID
          env:
            - name: PASEO_HOME
              value: /data/paseo
            # 0.11.x Host-header allowlist: the agent-runner (prod + dev, cross-namespace)
            # dials this Service's FQDN, so those names must be allow-listed. The
            # entrypoint always adds loopback + the pod hostname.
            - name: PASEO_HOSTNAMES
              value: paseo-jeeves,paseo-jeeves.paseo-jeeves,paseo-jeeves.paseo-jeeves.svc.cluster.local,paseo-jeeves.arsenikki.casa
            # git auth goes through the token-broker sidecar over a unix socket —
            # `jeeves git-credential` fetches short-lived App tokens from it. The App
            # private key is NOT in this container (#68).
            - name: JEEVES_TOKEN_BROKER_SOCKET
              value: /run/jeeves/token-broker.sock
            - name: PASEO_PASSWORD
              valueFrom: { secretKeyRef: { name: jeeves-secrets, key: PASEO_PASSWORD } }
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: { secretKeyRef: { name: jeeves-secrets, key: CLAUDE_CODE_OAUTH_TOKEN } }
            - name: AGY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-agy
                  key: AGY_TOKEN
                  optional: true
            # Persist Claude Code's session transcripts on the PVC (survive restarts).
            - name: CLAUDE_CONFIG_DIR
              value: /data/paseo/claude
            # /opt/bin (injected jeeves binary) MUST be on PATH or git's
            # `!jeeves git-credential` helper fails with "jeeves: not found". The shared
            # image sets no PATH beyond prepending /usr/local/go/bin, so set it explicitly.
            - name: PATH
              value: /opt/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            # Generic git hook (honored by the shared entrypoint): wire the App-token
            # credential helper + the Jeeves commit identity.
            - name: GIT_CREDENTIAL_HELPER
              value: "!jeeves git-credential"
            - name: GIT_AUTHOR_NAME
              value: Jeeves
            - name: GIT_AUTHOR_EMAIL
              value: jeeves@users.noreply.github.com
            - name: GIT_COMMITTER_NAME
              value: Jeeves
            - name: GIT_COMMITTER_EMAIL
              value: jeeves@users.noreply.github.com
            # Go module + build caches on the PVC (warm across runs, #140). The shared
            # image also sets these, but pin them here authoritatively.
            - name: GOPATH
              value: /data/paseo/go
            - name: GOCACHE
              value: /data/paseo/go-cache
            # GitHub PAT for gh CLI interactions
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jeeves-secrets
                  key: GH_TOKEN
                  optional: true
          readinessProbe:
            tcpSocket: { port: 6767 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6767 }
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data/paseo }
            - { name: workspaces, mountPath: /workspaces }
            - { name: broker-sock, mountPath: /run/jeeves } # shared token-broker socket dir
            - { name: jeeves-bin, mountPath: /opt/bin, readOnly: true } # injected jeeves binary (git-credential helper)
            # Seed Claude Code's user settings.json so the agent runs non-interactively.
            - { name: claude-settings, mountPath: /data/paseo/claude/settings.json, subPath: settings.json, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 3Gi }
        # Token broker (#68): holds the GitHub App private key and mints short-lived
        # installation tokens on a unix socket, so the durable key lives ONLY here.
        - name: token-broker
          image: ghcr.io/arsenikki/jeeves:v1.49.0
          imagePullPolicy: IfNotPresent
          command: ["jeeves", "token-broker"]
          envFrom:
            - secretRef: { name: jeeves-gh-app, optional: true }
          env:
            - name: LOG_LEVEL
              value: info
            - name: GITHUB_APP_KEY_FILE
              value: /etc/jeeves-ghapp/private-key.pem
            - name: JEEVES_TOKEN_BROKER_SOCKET
              value: /run/jeeves/token-broker.sock
          volumeMounts:
            - { name: ghapp, mountPath: /etc/jeeves-ghapp, readOnly: true }
            - { name: broker-sock, mountPath: /run/jeeves }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
        # Keeps base clones on the PVC for worktrees. Discovery is the GitHub App
        # installation (jeeves#175): repo-sync lists the installation's repos via the
        # App token and clones each under /data/paseo/repos/<name> — no repos.yaml, no
        # allowlist.
        - name: repo-sync
          image: ghcr.io/arsenikki/jeeves:v1.49.0
          imagePullPolicy: IfNotPresent
          command: ["jeeves", "repo-sync"]
          envFrom:
            - secretRef: { name: jeeves-gh-app, optional: true }
          env:
            - name: LOG_LEVEL
              value: info
            - name: GITHUB_APP_KEY_FILE
              value: /etc/jeeves-ghapp/private-key.pem
          volumeMounts:
            - { name: data, mountPath: /data/paseo }
            - { name: ghapp, mountPath: /etc/jeeves-ghapp, readOnly: true }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - name: claude-settings
          configMap: { name: jeeves-claude-settings }
        - name: ghapp
          secret:
            secretName: jeeves-gh-app
            optional: true
            items:
              - { key: private-key.pem, path: private-key.pem }
        - name: broker-sock
          emptyDir: {} # shared token-broker↔paseo socket dir (pod-local, not networked)
        - name: jeeves-bin
          emptyDir: {} # initContainer copies the jeeves binary here → on the daemon's PATH
        - name: workspaces
          persistentVolumeClaim:
            claimName: paseo-jeeves-workspaces
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-jeeves-workspaces
  namespace: paseo-jeeves
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi

