---
# Jeeves daemon secrets. Sourced from the same 1Password "Jeeves Agent" item the
# jeeves-prod/jeeves-dev instances already use, so the new daemon shares the password
# both agent-runners present (they connect with the same PASEO_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jeeves-secrets
  namespace: paseo-jeeves
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jeeves-secrets
    creationPolicy: Owner
  data:
    # Daemon TCP auth — must match what the agent-runners inject via --host.
    - secretKey: PASEO_PASSWORD
      remoteRef: { key: "Jeeves Agent", property: paseo_password }
    # Claude Code auth for the agents the daemon spawns.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef: { key: "Jeeves Agent", property: claude_code_oauth_token }
---
# GitHub App credentials for the token-broker + repo-sync sidecars. The private key
# lives ONLY in those sidecars (mounted from this secret); the agent container reaches
# git auth over the broker's unix socket (#68).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jeeves-gh-app
  namespace: paseo-jeeves
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jeeves-gh-app
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: { key: "Jeeves Agent", property: github_app_id }
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef: { key: "Jeeves Agent", property: github_app_installation_id }
    - secretKey: private-key.pem
      remoteRef: { key: "Jeeves Agent", property: github_app_private_key }
---
# GHCR pull secret for the private jeeves-paseo + jeeves images. Secrets are
# namespaced, so paseo-jeeves needs its own (mirror of the paseo-apps one). Shared
# read-only PAT item github-packages-ro.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: paseo-jeeves
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"arsenikki","password":"{{ .ghcr_pat }}","auth":"{{ printf `arsenikki:%s` .ghcr_pat | b64enc }}"}}}'
  data:
    - secretKey: ghcr_pat
      remoteRef:
        key: "github-packages-ro"
        property: credential
---
# AI-Pro (agy/antigravity) token (file-storage). Seeded into the daemon as
# $AGY_TOKEN; the entrypoint writes it to agy's token file. Sourced from 1Password
# homelab/paseo-homelab field `agy_token` — the one-time `agy` login's
# ~/.gemini/antigravity-cli/antigravity-oauth-token (a non-rotating refresh token,
# good for weeks). Lights up the `antigravity` provider; the daemon runs on claude
# without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-agy
  namespace: paseo-jeeves
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paseo-agy
    creationPolicy: Owner
  data:
    - secretKey: AGY_TOKEN
      remoteRef:
        key: "paseo-homelab"
        property: agy_token
