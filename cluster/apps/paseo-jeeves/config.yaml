---
# Claude Code user settings seeded into the daemon's CLAUDE_CONFIG_DIR so agents run
# NON-INTERACTIVELY (auto-approve the tools they explore with instead of raising a
# permission prompt that would stall the run). Mirror of the jeeves repo
# deploy/base/files/claude-settings.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jeeves-claude-settings
  namespace: paseo-jeeves
  labels:
    app.kubernetes.io/part-of: paseo-homelab
data:
  settings.json: |
    {
      "permissions": {
        "allow": ["Bash", "WebFetch", "WebSearch"]
      }
    }
