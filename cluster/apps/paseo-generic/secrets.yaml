---
# Claude work token for the `claude` provider (reuses the shared 1Password item,
# like jeeves/coachi/resepti). No new secret needed for the base deploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-secrets
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paseo-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: "Jeeves Agent"
        property: claude_code_oauth_token
---
# GHCR pull secret for the private paseo-homelab image (shared read-only PAT item).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"arsenikki","password":"{{ .ghcr_pat }}","auth":"{{ printf `arsenikki:%s` .ghcr_pat | b64enc }}"}}}'
  data:
    - secretKey: ghcr_pat
      remoteRef:
        key: "github-packages-ro"
        property: credential
---
# AI-Pro (agy/antigravity) token (file-storage). Seeded into the daemons as
# $AGY_TOKEN; the entrypoint writes it to agy's token file. Sourced from 1Password
# homelab/paseo-homelab field `agy_token` — the one-time `agy` login's
# ~/.gemini/antigravity-cli/antigravity-oauth-token (a non-rotating refresh token,
# good for weeks). Lights up the `antigravity` provider; the daemons run on claude
# without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-agy
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paseo-agy
    creationPolicy: Owner
  data:
    - secretKey: AGY_TOKEN
      remoteRef:
        key: "paseo-homelab"
        property: agy_token
