---
# paseo-generic — your personal/general Paseo daemon — chat, cluster debugging, ad-hoc (the `:tools` image variant:
# + kubectl, jq, gh, yq, 1Password CLI, dig/nc/tcpdump/htop). Reach it over the
# tailnet / port-forward and drive ad-hoc agents to poke at the cluster. Runs
# claude and AI-Pro antigravity (agy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo-generic
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
---
# Cluster access for this agent: `edit` — it can debug AND fix (restart/delete pods,
# exec, port-forward, scale, annotate e.g. an ExternalSecret force-sync), not just
# look. Plus paseo-debug-read (rbac.yaml) for what `edit` can't see: nodes, ArgoCD
# Applications, ARC, Cilium, Longhorn, CRDs, RBAC.
# Note: `edit` includes reading/writing Secrets in every namespace, and ArgoCD
# selfHeal reverts manual changes to managed objects — real fixes still go in git.
# (Was `view`; a ClusterRoleBinding's roleRef is immutable, hence the new name.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paseo-generic-edit
  labels:
    app.kubernetes.io/part-of: paseo-homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: paseo-generic
    namespace: paseo-generic
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paseo-generic
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  serviceName: paseo-generic
  replicas: 1
  selector:
    matchLabels:
      app: paseo-generic
  template:
    metadata:
      labels:
        app: paseo-generic
        app.kubernetes.io/part-of: paseo-homelab
    spec:
      serviceAccountName: paseo-generic
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch # skip recursive chown when PVC root already matches (fast rolls)
      # Keep the Paseo daemons off worker-02: it is a 3-vCPU VM on the 4-core nas host
      # (shared with TrueNAS + cp-03) and also runs Longhorn engines. Agent spikes
      # (builds, renovate, gh fan-out) pinned it at load ~100, starving Longhorn's
      # probes into crashloops. Hard rule — a soft spread put a daemon back on it.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [worker-02]
      containers:
        - name: paseo
          image: ghcr.io/arsenikki/paseo-homelab:0.11.2-13
          imagePullPolicy: Always
          env:
            - name: PASEO_HOME
              value: /data/paseo
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: CLAUDE_CODE_OAUTH_TOKEN
            # Daemon bearer auth. The 0.11.2 daemon bcrypts PASEO_PASSWORD from env
            # (resolveAuthConfig — env wins over any persisted hash), so this alone
            # enables auth with no image/entrypoint change. REQUIRED before exposing
            # this full-shell + cluster-read daemon over the ingress: the Host-header
            # allow-list below is a SEPARATE layer, not a credential. Sourced from the
            # dedicated `paseo-generic-password` 1Password item (NOT the paseo-apps one
            # — this tier is more privileged, so it gets its own password).
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: PASEO_PASSWORD
            - name: AGY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-agy
                  key: AGY_TOKEN
                  optional: true
            # Daemon Host-header allow-list: the 0.11.x daemon 403s a TCP client whose
            # Host isn't listed. SEPARATE from the PASEO_PASSWORD bearer auth above — a
            # client must satisfy BOTH (allow-listed Host AND password). The ingress host
            # must be listed so wss://paseo-generic.arsenikki.casa/ws is accepted; the
            # in-cluster Service FQDNs are kept for consistency; the entrypoint also adds
            # loopback + the pod hostname automatically (so port-forward still works).
            - name: PASEO_HOSTNAMES
              value: "paseo-generic,paseo-generic.paseo-generic,paseo-generic.paseo-generic.svc.cluster.local,paseo-generic.arsenikki.casa"
            # Image-baked Claude Code skills the entrypoint seeds into $CLAUDE_CONFIG_DIR
            # (comma-separated; paseo-homelab skills/). jeeves-handover files a PoC session
            # as a Jeeves board card via the in-cluster board Service. Generic-only.
            - name: PASEO_SEED_SKILLS
              value: "jeeves-handover"
            # GitHub CLI auth token for gh CLI operations
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: GH_TOKEN
                  optional: true
            # Read-only ghcr.io access (verify image tags exist; see secrets.yaml)
            - name: GHCR_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: GHCR_READ_TOKEN
                  optional: true
            # Configure git to use gh as credential helper for cloning / submodules
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: "credential.https://github.com.helper"
            - name: GIT_CONFIG_VALUE_0
              value: "!gh auth git-credential"
          ports:
            - containerPort: 6767
              name: paseo
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 10
            periodSeconds: 10
          # Same as paseo-apps/paseo-jeeves: restart a daemon that stops accepting connections
          # (a crashed worker the supervisor fails to respawn) instead of leaving it NotReady.
          livenessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "1" # observed steady ~0.8-1 core; 100m let the scheduler overpack worker-02
              memory: 1Gi # observed ~800Mi idle-ish, ~1.5Gi under agent load
            # 1536Mi OOMKilled the daemon (2026-10-29: 2 claude sessions + agy + go build hit
            # ~1.5Gi). Match paseo-apps/paseo-jeeves (3Gi) — agy alone is ~200MB resident.
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data/paseo
            - name: workspaces
              mountPath: /workspaces
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: paseo-generic-workspaces
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-generic-workspaces
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paseo-generic
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  type: ClusterIP
  selector:
    app: paseo-generic
  ports:
    - name: paseo
      port: 6767
      targetPort: 6767
