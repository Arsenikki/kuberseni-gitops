---
# paseo-generic — your personal/general Paseo daemon — chat, cluster debugging, ad-hoc (the `:tools` image variant:
# + kubectl, jq, gh, yq, 1Password CLI, dig/nc/tcpdump/htop). Reach it over the
# tailnet / port-forward and drive ad-hoc agents to poke at the cluster. Runs
# claude, AI-Pro antigravity (agy), and opencode (Gemini via GEMINI_API_KEY).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo-generic
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
---
# Cluster access for this agent. Defaults to READ-ONLY (`view`) — safe for an
# autonomous agent. Bump to `edit` (modify workloads) or `cluster-admin` (full, incl.
# fixing things) by changing roleRef.name if you want it able to act, not just look.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paseo-generic-view
  labels:
    app.kubernetes.io/part-of: paseo-homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: paseo-generic
    namespace: paseo-generic
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paseo-generic
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  serviceName: paseo-generic
  replicas: 1
  selector:
    matchLabels:
      app: paseo-generic
  template:
    metadata:
      labels:
        app: paseo-generic
        app.kubernetes.io/part-of: paseo-homelab
    spec:
      serviceAccountName: paseo-generic
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch # skip recursive chown when PVC root already matches (fast rolls)
      containers:
        - name: paseo
          image: ghcr.io/arsenikki/paseo-homelab:0.11.2-9
          imagePullPolicy: Always
          env:
            - name: PASEO_HOME
              value: /data/paseo
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: CLAUDE_CODE_OAUTH_TOKEN
            # Daemon bearer auth. The 0.11.2 daemon bcrypts PASEO_PASSWORD from env
            # (resolveAuthConfig — env wins over any persisted hash), so this alone
            # enables auth with no image/entrypoint change. REQUIRED before exposing
            # this full-shell + cluster-read daemon over the ingress: the Host-header
            # allow-list below is a SEPARATE layer, not a credential. Sourced from the
            # dedicated `paseo-generic-password` 1Password item (NOT the paseo-apps one
            # — this tier is more privileged, so it gets its own password).
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: PASEO_PASSWORD
            - name: AGY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-agy
                  key: AGY_TOKEN
                  optional: true
            # Gemini API key for the `opencode` provider (see secrets.yaml paseo-gemini).
            # opencode's "google" provider is the Vercel AI SDK's Google provider, which
            # actually reads GOOGLE_GENERATIVE_AI_API_KEY (confirmed live — GEMINI_API_KEY
            # alone produced "ProviderAuthError: Google Generative AI API key is missing").
            # Set both: GEMINI_API_KEY for anything else that reads the more common name
            # (and for forward-compat), GOOGLE_GENERATIVE_AI_API_KEY for opencode itself.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paseo-gemini
                  key: GEMINI_API_KEY
            - name: GOOGLE_GENERATIVE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paseo-gemini
                  key: GEMINI_API_KEY
                  optional: true
            # Daemon Host-header allow-list: the 0.11.x daemon 403s a TCP client whose
            # Host isn't listed. SEPARATE from the PASEO_PASSWORD bearer auth above — a
            # client must satisfy BOTH (allow-listed Host AND password). The ingress host
            # must be listed so wss://paseo-generic.arsenikki.casa/ws is accepted; the
            # in-cluster Service FQDNs are kept for consistency; the entrypoint also adds
            # loopback + the pod hostname automatically (so port-forward still works).
            - name: PASEO_HOSTNAMES
              value: "paseo-generic,paseo-generic.paseo-generic,paseo-generic.paseo-generic.svc.cluster.local,paseo-generic.arsenikki.casa"
            # GitHub CLI auth token for gh CLI operations
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: GH_TOKEN
                  optional: true
            # Configure git to use gh as credential helper for cloning / submodules
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: "credential.https://github.com.helper"
            - name: GIT_CONFIG_VALUE_0
              value: "!gh auth git-credential"
          ports:
            - containerPort: 6767
              name: paseo
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data/paseo
            - name: workspaces
              mountPath: /workspaces
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: paseo-generic-workspaces
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-generic-workspaces
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paseo-generic
  namespace: paseo-generic
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  type: ClusterIP
  selector:
    app: paseo-generic
  ports:
    - name: paseo
      port: 6767
      targetPort: 6767
