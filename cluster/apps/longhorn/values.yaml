---
preUpgradeChecker:
  jobEnabled: false

persistence:
  defaultClassReplicaCount: 2

defaultSettings:
  createDefaultDiskLabeledNodes: true
  # Use the dedicated data disk mount point, not the OS disk.
  # Both workers mount their data disk at /var/mnt/longhorn-data via Talos machine config.
  defaultDataPath: /var/mnt/longhorn-data
  defaultReplicaCount: 2
  # Hard anti-affinity: refuse to place both replicas of a volume on the same node
  # (fail loud / degraded) rather than silently collapsing redundancy onto one node.
  # Set false after the 2026-07-04 incident where worker-02 filled with orphaned
  # replicas, became unschedulable, and all 32 volumes stacked both replicas on
  # worker-01. Trade-off: with only 2 storage nodes, a node down/full leaves the
  # affected volumes degraded until it returns.
  # Node dies unplanned (not a drain): force-delete its Longhorn-backed pods once
  # k8s marks them Terminating, so RWO volumes detach and the pods restart on a
  # healthy node. Default "do-nothing" leaves StatefulSets (home-assistant-0)
  # stuck Terminating until the node returns, which defeats the PriorityClasses.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  replicaSoftAntiAffinity: false
  replicaAutoBalance: best-effort
  # Cap concurrent replica rebuilds per node at 3 (Longhorn default is 5). A storage
  # node reboot leaves every volume with a replica there degraded, and all rebuild
  # at once; on the weak 4-core N5105 nas host (worker-02) 5 concurrent rebuilds
  # drove load to ~11 and CPU-starved the Longhorn pods into liveness crashloops
  # (2026-10-25). 3 balances rebuild speed against host headroom. The deeper fix is
  # still capacity (fewer tenants on nas / more cores), but this bounds the blast radius.
  concurrentReplicaRebuildPerNodeLimit: 3
  # Auto-delete orphaned replica/instance resources so a storage node can't silently
  # fill with stale replica directories (the root cause of the 2026-07-04 collapse:
  # orphans pushed worker-02 below the 25% min-available threshold -> unschedulable).
  orphanResourceAutoDeletion: "replica-data;instance"
  # Longhorn stays off the control planes: they have no Longhorn disks and nothing
  # pinned there mounts a volume. Running there cost each 5 GB control plane ~0.4
  # core of requests and ~300 Mi, and parked the CSI sidecars on control-plane-03
  # (the overloaded nas host). Explicitly empty: an absent key would leave the old
  # value in the Setting. A change here only takes effect once EVERY Longhorn
  # volume is detached (longhorn-manager setting controller), so it needs a
  # maintenance window, see PR #938.
  taintToleration: ""

longhornManager:
  # Without a request the manager is BestEffort → cgroup cpu.weight 1 (vs ~111 for
  # the burstable slice). The longhorn-critical PriorityClass only affects scheduling,
  # not CPU share, so under contention its 4s healthz probe timed out and the node
  # flapped "ManagerPodDown". Other Longhorn-spawned pods get a default request from
  # resources/limitrange.yaml (the chart has no knob for them).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # No control-plane toleration: see taintToleration above.

longhornUI:
  replicas: 1

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
  host: longhorn.arsenikki.casa
  tls: true
  tlsSecret: longhorn-tls
