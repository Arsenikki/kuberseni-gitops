---
# Daily trim of the Longhorn data disk and /var on every storage node.
#
# Why: Talos runs no fstrim and mounts the data disk (see infra/talos/patches/
# worker-storage.yaml) without the `discard` option, so blocks freed by Longhorn
# (deleted/rebuilt/orphaned replicas) never propagate back to the underlying
# Proxmox LVM-thin pool. Left unchecked the thin pool ratchets toward full — on
# 2026-07-04 it hit 100% on nas and froze the VMs.
#
# Why not plain fstrim via hostPath: FITRIM ioctls sent through a Kubernetes
# hostPath bind mount are not dispatched to the XFS filesystem driver — the
# ioctl returns ENOTTY silently. The fix is to enter Talos' own mount namespace
# via setns(2) + chroot, then call xfs_spaceman(8) which ships with Talos and
# works correctly against the live XFS mount.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-fstrim
  namespace: longhorn-system
spec:
  # Daily (was weekly): on 2026-11-01 the nas thin pool was back at 98.4% six days
  # after the last run — Longhorn rebuild/replica churn frees ~17G/week on worker-02.
  schedule: "0 3 * * *" # daily 03:00
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completions: 2 # one per storage node
      parallelism: 2
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: longhorn-fstrim
        spec:
          restartPolicy: Never
          hostPID: true # needed to access /proc/1/ns/mnt
          securityContext:
            seccompProfile:
              type: Unconfined # setns(2) is blocked by the default seccomp profile
          # Only the Longhorn storage nodes carry the data disk (both workers have
          # this label; control-planes do not).
          nodeSelector:
            node.longhorn.io/create-default-disk: "true"
          # Force the two Job pods onto two different nodes -> one trim per node.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: longhorn-fstrim
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: fstrim
              image: python:3.12-slim
              command:
                - python3
                - -c
                - |
                  import ctypes, os, socket, subprocess
                  libc = ctypes.CDLL(None, use_errno=True)
                  CLONE_NEWNS = 0x00020000
                  node = socket.gethostname()
                  print(f"trimming {node}", flush=True)
                  pid = os.fork()
                  if pid == 0:
                      nsfd = os.open("/proc/1/ns/mnt", os.O_RDONLY)
                      if libc.setns(nsfd, CLONE_NEWNS) != 0:
                          raise OSError(ctypes.get_errno(), "setns failed")
                      os.close(nsfd)
                      os.chroot("/proc/1/root")
                      os.chdir("/")
                      # /var (Talos EPHEMERAL, also XFS without `discard`) holds
                      # container images; image GC churn left ~10G of freed-but-
                      # allocated blocks in the thin pool on worker-02.
                      rc = 0
                      for path in ("/var/mnt/longhorn-data", "/var"):
                          r = subprocess.run(["/usr/bin/xfs_spaceman", "-c", "trim -f", path])
                          print(f"  {path}: exit {r.returncode}", flush=True)
                          rc = rc or r.returncode
                      os._exit(rc)
                  else:
                      _, status = os.waitpid(pid, 0)
                      rc = os.waitstatus_to_exitcode(status)
                      print(f"done on {node}, exit: {rc}", flush=True)
                      raise SystemExit(rc)
              securityContext:
                privileged: true
