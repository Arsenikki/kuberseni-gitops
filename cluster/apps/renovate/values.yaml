---
# Mend Renovate Community Edition (self-hosted) — replaces the hosted Mend
# Renovate GitHub App for this repo. Values overlay for the upstream
# mend-renovate-ce Helm chart (see cluster/argocd/apps/renovate-ce.yaml).
#
# Trigger model: SCHEDULER-ONLY. CE's built-in cron scans on the hour and on
# startup; no public webhook/ingress is exposed (outbound to api.github.com
# only). Repo config comes from this repo's existing .github/renovate.json5.
image:
  repository: ghcr.io/mend/renovate-ce
  tag: "14.8.0"

renovate:
  # You must accept Mend's ToS (https://www.mend.io/terms-of-service/) — 'y'.
  mendRnvAcceptTos: "y"
  mendRnvPlatform: "github"
  # License key, GitHub App ID + private key come from the ESO-managed Secret
  # (see externalsecret.yaml). The chart pulls mendRnvLicenseKey /
  # mendRnvGithubAppId / mendRnvGithubAppKey from it.
  existingSecret: "renovate-ce"
  # Blast-radius guard: only ever act on this one repo (defence-in-depth on top
  # of installing the GitHub App on this repo only).
  mendRnvAutoDiscoverFilter: "Arsenikki/kuberseni-gitops"
  mendRnvSyncOnStartup: "true"
  # Hourly full scan (CE default) — matches the hosted app's cadence.
  mendRnvCronJobSchedulerAll: "0 * * * *"
  mendRnvSqliteFilePath: "/tmp/renovate/renovate-ce.sqlite"
  # The package cache (cacache under /tmp/renovate/cache) never deletes replaced
  # entries, so on this persistent 2Gi ext4 PVC (131,072 inodes) it used up every
  # inode by mid-July 2026 (~82k orphaned content files at 49% of the space). From
  # then on every run hit ENOSPC mid-clone ("Disk space error - skipping") and
  # Renovate opened nothing for ~3.5 months. A daily cleanup of what the workers
  # wrote under /tmp/renovate/{cache,repos} keeps it bounded; the SQLite queue
  # and job logs are not touched. Daily, not "always": an always-empty cache makes
  # every hourly run cold. Quoted: a bare `off` would parse as a YAML boolean.
  mendRnvWorkerCleanup: "0 0 * * *"
  logLevel: "info"
  logFormat: "json"
  # Private ghcr.io auth: inject the shared read-only GHCR creds (github-packages-ro, from ESO,
  # see externalsecret.yaml) as env, then reference them from config.js below —
  # so the token is never written into Git.
  extraEnvVars:
    - name: GHCR_USER
      valueFrom:
        secretKeyRef:
          name: renovate-ce
          key: ghcrUsername
    - name: GHCR_PAT
      valueFrom:
        secretKeyRef:
          name: renovate-ce
          key: ghcrPat
  # Self-hosted global config (mounted as /usr/src/app/config.js), merged under
  # the repo's renovate.json5. The hostRule uses username + password because
  # GHCR needs basic auth (a `token` field would take priority and break it).
  config: |
    module.exports = {
      hostRules: [
        {
          hostType: 'docker',
          matchHost: 'ghcr.io',
          username: process.env.GHCR_USER,
          password: process.env.GHCR_PAT,
        },
      ],
    };

# Purge the package cache on every pod start. It is pure cache and rebuilds in one
# run. Needed because CE's own cleanup (mendRnvWorkerCleanup above) only deletes
# files created since the current process started (find -newercc), so it never
# reclaims orphans from earlier pod lifetimes, like the July backlog that filled the
# inode table. Same image as the main container (already on the node).
initContainers:
  - name: purge-package-cache
    image: ghcr.io/mend/renovate-ce:14.8.0-full
    command: ["sh", "-c", "rm -rf /tmp/renovate/cache/renovate"]
    volumeMounts:
      - name: renovate-ce-cache-volume
        mountPath: /tmp/renovate

# Persist the SQLite job queue + repo cache across restarts.
cachePersistence:
  enabled: true
  storageClass: "longhorn"
  accessModes:
    - ReadWriteOnce
  size: 2Gi

# Container runs as uid/gid 12021; fsGroup makes the PVC writable.
podSecurityContext:
  runAsUser: 12021
  runAsGroup: 12021
  fsGroup: 12021

# The chart sets no resources by default (BestEffort). Give it a real request
# so it is not first to be OOM-killed, and a limit that covers a scan burst.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

service:
  type: ClusterIP

# Scheduler-only: no inbound endpoint.
ingress:
  enabled: false

# Temporary (2026-11-02): run only on worker-01, the node that has the 2.9 GB
# renovate-ce "-full" image cached. Pulling it onto a worker with ~11 GiB of
# ephemeral space free pushes that node past the kubelet's disk-eviction line:
# after #821's rollout worker-01 went DiskPressure and evicted the pod. Drop
# this once the workers' ephemeral disks have headroom for the image.
nodeSelector:
  kubernetes.io/hostname: worker-01
