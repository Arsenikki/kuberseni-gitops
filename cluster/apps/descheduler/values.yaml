---
# Descheduler — rebalances the cluster after a node recovers or gets lopsided.
#
# Context: a power cut took down the minipc host (worker-01); Kubernetes moved
# all its pods onto worker-02 (the weak 4-core NAS host) and never moved them
# back when minipc returned, overloading worker-02 until containerd wedged and
# Authentik (and every authentik-protected app) went down. This CronJob evicts
# pods off over-utilized nodes on a schedule so the scheduler can spread them
# back onto a recovered node.
#
# Safety: it ONLY evicts *stateless* pods. PVC-backed pods (StatefulSets) are
# protected via podProtections, so Longhorn volumes never detach/attach as a
# result of descheduling (this cluster has thin Longhorn redundancy). nodeFit
# ensures a pod is only evicted when it can actually land somewhere better —
# so it stays a no-op while a node is cordoned.
kind: CronJob
schedule: "*/30 * * * *"
suspend: false

# Modest footprint — this only runs briefly every 30 minutes.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
deschedulerPolicy:
  # Cap churn per run.
  maxNoOfPodsToEvictPerNode: 3
  # Pull live CPU/memory from metrics-server (cluster/apps/metrics-server) so
  # LowNodeUtilization balances on ACTUAL usage, not pod requests. Without this,
  # worker-02 — the weak NAS node, packed with request-less tenants (jeeves,
  # jeeves-board, alloy) — reads as under-utilized by the requests-based heuristic and
  # never sheds load, which is why it keeps getting repacked to CPU/RAM
  # starvation. Requires metrics-server to be deployed and serving (kubectl top
  # nodes must work) BEFORE this merges, or every run errors. The chart
  # auto-grants the metrics.k8s.io RBAC when a KubernetesMetrics provider is set.
  metricsProviders:
    - source: KubernetesMetrics
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            # Only evict a pod if it can actually be scheduled elsewhere.
            nodeFit: true
            # Never evict stateful workloads (avoids Longhorn volume churn).
            podProtections:
              extraEnabled:
                - "PodsWithPVC"
        - name: RemoveDuplicates
        - name: RemovePodsHavingTooManyRestarts
          args:
            podRestartThreshold: 100
            includingInitContainers: true
        - name: RemovePodsViolatingNodeTaints
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
              - requiredDuringSchedulingIgnoredDuringExecution
        - name: RemovePodsViolatingInterPodAntiAffinity
        # Hard (DoNotSchedule) spread constraints only: evicts a pod left on the
        # wrong side of its own spread, e.g. after a node came back.
        - name: RemovePodsViolatingTopologySpreadConstraint
          args:
            namespaces:
              exclude:
                - jeeves-prod
                - jeeves-dev
        - name: LowNodeUtilization
          args:
            # Evaluate utilization from real metrics (above) instead of the sum
            # of pod requests, so an overloaded-but-request-less node is seen.
            metricsUtilization:
              source: KubernetesMetrics
            # A node is "under" only if below ALL thresholds and "over" if above
            # ANY target. The old 20/50 (with pods) never fired: every node sits
            # above 50% memory, so all five read as over and nothing moved. The
            # control planes idle at ~80-86% memory, hence the 90% memory target.
            # Today this reads worker-01 (~12% cpu, ~60% mem) as under and
            # worker-02 (~80% cpu) as over.
            thresholds:
              cpu: 30
              memory: 70
            targetThresholds:
              cpu: 60
              memory: 90
            # Jeeves places its own pods with hard per-node spread constraints;
            # moving them would only bounce them back every run.
            evictableNamespaces:
              exclude:
                - jeeves-prod
                - jeeves-dev
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - LowNodeUtilization
            - RemovePodsViolatingTopologySpreadConstraint
        deschedule:
          enabled:
            - RemovePodsHavingTooManyRestarts
            - RemovePodsViolatingNodeTaints
            - RemovePodsViolatingNodeAffinity
            - RemovePodsViolatingInterPodAntiAffinity
