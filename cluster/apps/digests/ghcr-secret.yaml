---
# GHCR image-pull secret — lets the cluster pull the PRIVATE digests image
# (ghcr.io/arsenikki/digests). ESO renders a dockerconfigjson from
# the shared 1Password `github-packages-ro` item (a long-lived read:packages PAT),
# so rotating that one item fixes every consumer at once. Referenced by
# imagePullSecrets on the digests CronJob.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: digests
  labels:
    app.kubernetes.io/part-of: digests
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"arsenikki","password":"{{ .ghcr_pat }}","auth":"{{ printf `arsenikki:%s` .ghcr_pat | b64enc }}"}}}'
  data:
    - secretKey: ghcr_pat
      remoteRef:
        key: "github-packages-ro"
        property: credential
