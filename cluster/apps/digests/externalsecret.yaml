---
# App secrets. 1Password item "digests" (vault homelab):
#   google_token_personal  authorized-user token JSON from `digests auth --profile personal`
#   github_app_id, github_app_installation_id, github_app_private_key
#                          GitHub App (Contents: read/write) installed on Arsenikki/daily-digests
#                          only; the job mints a 1-hour installation token per run to push
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: digests
  namespace: digests
  labels:
    app.kubernetes.io/part-of: digests
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: digests
    creationPolicy: Owner
  data:
    # AI steps run as agents on the shared paseo-apps daemon (Gemini via its antigravity
    # provider), same as resepti. The paseo CLI sends this inside --host.
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: "paseo-apps-password"
        property: password
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: "digests"
        property: github_app_id
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: "digests"
        property: github_app_installation_id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: "digests"
        property: github_app_private_key
---
# Google OAuth token as a file (mounted at /secrets/google), kept out of the env-var secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: digests-google
  namespace: digests
  labels:
    app.kubernetes.io/part-of: digests
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: digests-google
    creationPolicy: Owner
  data:
    - secretKey: personal.json
      remoteRef:
        key: "digests"
        property: google_token_personal
---
# Telegram: reuse @CasaAlertingBot, like media-notifier and tautulli.
# 1Password item "CasaBot (Telegram)" (vault homelab): credential (bot token), chat_id
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: digests-telegram
  namespace: digests
  labels:
    app.kubernetes.io/part-of: digests
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: digests-telegram
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: "CasaBot (Telegram)"
        property: credential
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: "CasaBot (Telegram)"
        property: chat_id
