---
# Claude work token for the `claude` provider (reuses the shared 1Password item,
# like jeeves/coachi/resepti). No new secret needed for the base deploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-secrets
  namespace: paseo
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paseo-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: "Jeeves Agent"
        property: claude_code_oauth_token
---
# GHCR pull secret for the private paseo-homelab image (shared read-only PAT item).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: paseo
  labels:
    app.kubernetes.io/part-of: paseo-homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"arsenikki","password":"{{ .ghcr_pat }}","auth":"{{ printf `arsenikki:%s` .ghcr_pat | b64enc }}"}}}'
  data:
    - secretKey: ghcr_pat
      remoteRef:
        key: "github-packages-ro"
        property: credential
# ---------------------------------------------------------------------------
# AI-Pro (agy/antigravity) token — ADD AFTER the one-time `agy` login.
# The daemon runs fine without this (claude provider only); seeding it lights up
# the `antigravity` provider. Steps:
#   1) Log in agy once on a Linux box; capture the token JSON:
#        secret-tool lookup service gemini username antigravity   # (or the ~/.gemini file in file mode)
#   2) Store it in 1Password item "paseo-homelab" under field `agy_token_json`.
#   3) Uncomment the ExternalSecret below.
