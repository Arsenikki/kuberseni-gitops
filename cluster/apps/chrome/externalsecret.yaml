---
# Basic-auth creds for the Selkies front end, pulled from 1Password (vault
# "homelab") via the `onepassword` ClusterSecretStore.
#
# 1Password item required — create item "chrome" in the homelab vault with:
#   - username   (any value, e.g. "arseni")
#   - password   (LONG random string — this is the LAST gate if Authentik
#                 forward-auth is ever bypassed; NEVER leave it as abc/abc)
#
# CRITICAL: if PASSWORD resolves empty, the Selkies endpoint has NO auth at all.
# Until this item exists the ExternalSecret stays NotReady and the pod won't get
# its creds — create the item first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chrome-auth
  namespace: chrome
  labels:
    app.kubernetes.io/part-of: chrome
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: chrome-auth
    creationPolicy: Owner
  data:
    - secretKey: CUSTOM_USER
      remoteRef:
        key: "chrome"
        property: username
    - secretKey: PASSWORD
      remoteRef:
        key: "chrome"
        property: password
