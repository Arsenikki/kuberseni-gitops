---
# linuxserver/chromium (Selkies): a remote Chromium streamed over WebSocket on
# :3000, with Bypass Paywalls Clean (BPC) loaded as an unpacked extension so
# paywalled articles render. Reach it at https://chrome.arsenikki.casa (internal
# only) behind Authentik forward-auth.
#
# SECURITY MODEL (full threat model + checklist in README.md):
#   - This pod is an interactive, OUTBOUND-CAPABLE browser foothold sitting next
#     to Proxmox/TrueNAS/ArgoCD/Postgres. The real boundary is the egress
#     CiliumNetworkPolicy (networkpolicy.yaml — WHICH YOU MUST VALIDATE) plus
#     internal-only ingress + Authentik + a real basic-auth password.
#   - Trust the IMAGE, not the extensions: image pinned by tag (never :latest per
#     repo rules); BPC + uBlock Origin Lite are reviewed + pinned manually into
#     the PVC, loaded via --disable-extensions-except so ONLY those two can run.
#   - Do not add SYS_ADMIN or --no-sandbox. Keep Chromium's own sandbox; seccomp
#     must be Unconfined for it to start (compensated by network isolation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: chrome
  labels:
    app.kubernetes.io/part-of: chrome
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO PVC — a RollingUpdate would deadlock on the volume
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
        app.kubernetes.io/part-of: chrome
    spec:
      # A browser pod has no business talking to the kube API — drop the token.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000          # make the /config PVC writable by the abc (PUID 1000) user
        # Chromium's sandbox needs seccomp Unconfined to start. This is the
        # documented requirement for this image; network isolation compensates.
        seccompProfile:
          type: Unconfined
      containers:
        - name: chromium
          image: lscr.io/linuxserver/chromium:d2f5e718-ls58
          imagePullPolicy: IfNotPresent
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: "Europe/London" }
            - { name: TITLE, value: "chrome.arsenikki.casa" }
            # --- auth: Authentik forward-auth ONLY ---
            # No Selkies basic-auth: CUSTOM_USER/PASSWORD are intentionally unset
            # (unset => the Selkies endpoint has no basic-auth prompt). This is safe
            # because the backend is unreachable except via Traefik -> Authentik:
            # the Service is ClusterIP-only and the CiliumNetworkPolicy ingress rule
            # only admits :3000 from the Traefik pod. Tradeoff: no second gate if
            # forward-auth is ever bypassed; accepted for a single-user internal app.
            # --- CSWSH fix: only THIS origin may open the streaming WebSocket ---
            - { name: SELKIES_ALLOWED_ORIGINS, value: "https://chrome.arsenikki.casa" }
            # --- hardening: no in-session terminal/sudo; no file transfers ---
            - { name: HARDEN_DESKTOP, value: "true" }
            - { name: DISABLE_SUDO, value: "true" }
            - { name: DISABLE_TERMINALS, value: "true" }
            # Clipboard both-ways so you can paste INTO the remote browser (copy
            # URLs/text in). Low risk given auth + egress lockdown; needs HTTPS
            # (satisfied) and granting the site clipboard permission in-browser.
            - { name: SELKIES_ENABLE_CLIPBOARD, value: "true" }
            - { name: SELKIES_FILE_TRANSFERS, value: "" }
            # --- close the IPv6 egress bypass at the container level too ---
            - { name: DISABLE_IPV6, value: "true" }
            # --- The browser launch flags (both extensions, the CDP debug port,
            #     and the non-default profile required for CDP on Chrome 136+) are
            #     hardcoded in the wrapped-chromium OVERRIDE (launch-fix.yaml),
            #     mounted below. That makes them persist across EVERY launch path
            #     (autostart AND relaunches), not just when CHROME_CLI is passed.
            #     CHROME_CLI now only supplies the start page. ---
            - name: CHROME_CLI
              value: "https://www.google.com"
          ports:
            - { containerPort: 3000, name: http, protocol: TCP }
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi          # must cover Chromium + the 1Gi RAM-backed /dev/shm
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: dshm, mountPath: /dev/shm }
            # Override the Selkies launcher so extensions + CDP persist across
            # relaunches (see launch-fix.yaml).
            - { name: launch-fix, mountPath: /usr/bin/wrapped-chromium, subPath: wrapped-chromium, readOnly: true }
          # TCP probes (not httpGet): the HTTP endpoint requires basic auth, so an
          # httpGet probe would 401 and flap.
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          # Liveness checks CDP (127.0.0.1:9222), NOT the stream (:3000): the
          # Selkies stream server stays up even when the BROWSER process dies, so
          # a :3000 probe never notices a dead browser (that's why the opener went
          # dead "once it worked"). If chromium dies, CDP stops answering -> this
          # fails -> the container restarts -> autostart -> wrapped-chromium
          # override -> browser is back WITH extensions + CDP. Self-healing.
          # exec (not tcpSocket) because CDP binds loopback-only; generous delays
          # so a slow cold start is never mistaken for a crash.
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -sf http://127.0.0.1:9222/json/version >/dev/null"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
        # Opener sidecar: tiny dependency-free HTTP server (script in opener.yaml)
        # that turns GET /open?token=&url= into a CDP "open tab" on 127.0.0.1:9222.
        # Hardened (non-root, read-only rootfs, drop-all caps) — unlike the s6
        # chromium container it has no such constraints.
        - name: opener
          image: python:3.13-slim
          command: ["python3", "/opener/opener.py"]
          env:
            - name: OPENER_TOKEN
              valueFrom: { secretKeyRef: { name: chrome-opener, key: token } }
            - { name: VIEWER_URL, value: "https://chrome.arsenikki.casa" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports:
            - { containerPort: 9000, name: opener, protocol: TCP }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: 9000 }
            initialDelaySeconds: 3
            periodSeconds: 15
          volumeMounts:
            - { name: opener-script, mountPath: /opener, readOnly: true }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: chrome-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: opener-script
          configMap:
            name: chrome-opener-script
        - name: launch-fix
          configMap:
            name: chrome-launch-fix
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: chrome
  namespace: chrome
  labels:
    app.kubernetes.io/part-of: chrome
spec:
  # ClusterIP ONLY — never NodePort/LoadBalancer. Only Traefik may reach :3000
  # (enforced by the ingress rule in networkpolicy.yaml).
  type: ClusterIP
  selector:
    app: chrome
  ports:
    - name: http
      port: 80
      targetPort: 3000
