---
# Pulls Untappd API credentials + the Postgres password from 1Password (vault
# "homelab") via the `onepassword` ClusterSecretStore into a single Kubernetes
# secret `untappi-go-secrets`, consumed by the api / worker / migrate-job / db.
#
# 1Password items required in the homelab vault (both exist):
#   - "untappd-api-creds" with fields: client_id, client_secret
#   - "untappi-go"        with field:  postgres_password  (created 2026-08-08)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: untappi-go-secrets
  namespace: untappi-go
  labels:
    app.kubernetes.io/part-of: untappi-go
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: untappi-go-secrets
    creationPolicy: Owner
  data:
    - secretKey: UNTAPPD_CLIENT_ID
      remoteRef:
        key: "untappd-api-creds"
        property: client_id
    - secretKey: UNTAPPD_CLIENT_SECRET
      remoteRef:
        key: "untappd-api-creds"
        property: client_secret
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "untappi-go"
        property: postgres_password
