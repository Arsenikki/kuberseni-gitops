---
apiVersion: v1
kind: Service
metadata:
  name: untappi-postgres
  namespace: untappi-go
  labels:
    app.kubernetes.io/part-of: untappi-go
spec:
  # Headless service — stable per-pod DNS for the StatefulSet.
  clusterIP: None
  selector:
    app: untappi-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: untappi-postgres
  namespace: untappi-go
  labels:
    app.kubernetes.io/part-of: untappi-go
spec:
  serviceName: untappi-postgres
  replicas: 1
  selector:
    matchLabels:
      app: untappi-postgres
  template:
    metadata:
      labels:
        app: untappi-postgres
        app.kubernetes.io/part-of: untappi-go
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: untappi
            - name: POSTGRES_DB
              value: untappi
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: untappi-go-secrets
                  key: POSTGRES_PASSWORD
            # postgis/postgis initdb writes to a subdir so the mounted volume can
            # keep its lost+found without breaking Postgres init.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "untappi", "-d", "untappi"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "untappi", "-d", "untappi"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
