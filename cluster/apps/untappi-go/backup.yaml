---
# Nightly logical backup of the untappi PostGIS database to SeaweedFS S3, gzipped
# under the shared backups/ prefix (backups/untappi/) with 30-day retention.
# Mirrors the coachi backup pattern — until now untappi had NO backup at all, so
# a dropped row / bad migration / lost PVC was unrecoverable.
#
# Lands in the same coachi-media/backups/ tree that the `backup` app recursively
# replicates offsite to Google Drive, so these dumps go off-cluster for free.
#
# Restore: `rclone copy store:coachi-media/backups/untappi/untappi-<ts>.sql.gz .` (store = the S3 remote, see env) then
# `gunzip -c untappi-<ts>.sql.gz | psql -h untappi-postgres -U untappi -d untappi`
# (the target DB must have the postgis extension available — the postgis image does).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: untappi-backup-s3
  namespace: untappi-go
  labels:
    app.kubernetes.io/part-of: untappi-go
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: untappi-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: secret_key
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: untappi-db-backup
  namespace: untappi-go
  labels:
    app.kubernetes.io/part-of: untappi-go
spec:
  schedule: "30 3 * * *" # daily 03:30 UTC (after coachi 03:00, before offsite copy 05:00)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Fail a stuck run instead of hanging forever: with concurrencyPolicy Forbid a
      # pod stuck in ImagePullBackOff/ContainerCreating blocked every later run for
      # 3 weeks (2026-10). pg_dump + upload take seconds.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: untappi-go
        spec:
          restartPolicy: Never
          volumes:
            - name: work
              emptyDir: {}
          # pg_dump runs first (init); a failure here fails the pod BEFORE any
          # upload, so a truncated dump can never be published.
          initContainers:
            - name: dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump -h untappi-postgres -U untappi -d untappi \
                    --no-owner --no-privileges -f "/work/untappi-${ts}.sql"
                  gzip -9 "/work/untappi-${ts}.sql"
                  echo "wrote /work/untappi-${ts}.sql.gz ($(wc -c < "/work/untappi-${ts}.sql.gz") bytes)"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: untappi-go-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              # rclone (was minio/mc): MinIO pulled its images from Docker Hub, so the
              # pinned mc tag 404s and every run since 2026-10-12 sat in
              # ImagePullBackOff (Forbid concurrency → no new runs either). rclone is
              # already the offsite job's tool; the S3 remote is configured via env.
              image: rclone/rclone:1.75.2
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  rclone copy /work/ "store:${S3_BUCKET}/backups/untappi/" --include "untappi-*.sql.gz"
                  rclone delete "store:${S3_BUCKET}/backups/untappi/" --max-depth 1 --include "untappi-*.sql.gz" --min-age 30d
                  echo "backups now:"; rclone lsl "store:${S3_BUCKET}/backups/untappi/" --max-depth 1 --include "untappi-*.sql.gz" | sort -k2,3 | tail -5
              env:
                - name: S3_ENDPOINT
                  value: "seaweedfs-s3.monitoring:8333"
                - name: S3_BUCKET
                  value: "coachi-media"
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: untappi-backup-s3
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: untappi-backup-s3
                      key: S3_SECRET_KEY
                - { name: RCLONE_CONFIG_STORE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_STORE_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_STORE_ENDPOINT, value: "http://$(S3_ENDPOINT)" }
                - { name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID, value: "$(S3_ACCESS_KEY)" }
                - { name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY, value: "$(S3_SECRET_KEY)" }
                - { name: RCLONE_CONFIG_STORE_NO_CHECK_BUCKET, value: "true" }
              volumeMounts:
                - name: work
                  mountPath: /work
