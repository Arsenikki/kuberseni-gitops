---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: philips-bridge
  namespace: home-automation
  labels:
    app: philips-bridge
  annotations:
    # auto-restart when the script ConfigMap changes (stakater reloader)
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # single CoAP client; never run two at once
  selector:
    matchLabels:
      app: philips-bridge
  template:
    metadata:
      labels:
        app: philips-bridge
    spec:
      # The purifier's CoAP status reply is a large, IP-fragmented UDP datagram.
      # On the pod network it goes through Cilium's BPF masquerade (vxlan), which
      # cannot reverse-NAT the non-first fragments (no UDP ports in them), so the
      # status never arrives: small replies (ping, /sys/dev/sync) work, status
      # times out (verified 2026-11-15). Host networking skips the NAT and lets the
      # node kernel reassemble the fragments, like home-assistant (also hostNetwork).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet  # still resolve mosquitto.*.svc
      # Historically pinned here; kept so only one node talks to the purifier.
      nodeSelector:
        kubernetes.io/hostname: control-plane-01
      tolerations:
        - operator: Exists
      containers:
        - name: bridge
          # renovate: ignore
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - "pip install --quiet --root-user-action=ignore aioairctrl==0.3.1 'paho-mqtt<2' && exec python -u /app/bridge.py"
          env:
            - { name: PURIFIER_HOST, value: "192.168.1.150" }
            - { name: MQTT_HOST, value: "mosquitto.home-automation.svc.cluster.local" }
            - { name: MQTT_PORT, value: "1883" }
            - { name: POLL_SECONDS, value: "30" }
            - { name: TZ, value: "Europe/London" }
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: PHILIPS_USERNAME
            - name: MQTT_PASS
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: PHILIPS_PASSWORD
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: philips-bridge-script
