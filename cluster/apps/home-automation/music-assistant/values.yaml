---
controllers:
  main:
    type: statefulset          # MA holds stateful data (like home-assistant)
    containers:
      main:
        image:
          repository: ghcr.io/music-assistant/server
          tag: 2.10.12         # pin an explicit tag so Renovate can track it — never `latest`
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/London
        # The Snapcast provider is disabled in the Music Assistant UI: no clients, every
        # player uses Sendspin. With hostNetwork its built-in snapserver would listen on
        # 1704/1705 of the node IP whatever the Service below exposes.
        resources:
          requests:
            # 14d p99 97m, max 139m (2026-11-26); memory peak 568Mi. Was 300m /
            # 256Mi, sized from an estimate of 0.2-0.5 cores while streaming.
            cpu: 100m
            memory: 640Mi
          limits:
            # Leak fuse: MA 2.7.x has open OOM/RAM-ramp reports (#4263/#4991/#5089).
            # Cap so a leak restarts only MA, not the node that also hosts Home Assistant.
            memory: 1Gi

# Host networking so the AirPlay provider can do mDNS discovery + AirPlay 2 PTP
# sync on the LAN. This is MA's documented requirement for AirPlay/Cast/Sonos —
# on the pod network they are undiscoverable and AirPlay has NO manual-IP
# fallback (unlike Sendspin). Mirrors home-assistant, which already runs
# hostNetwork in this namespace (PSA is already `privileged`).
# Pinned to one node so the Published IP that AirPlay devices dial back to (the
# node LAN IP) stays stable. worker-01 (192.168.1.44, Proxmox host minipc) rather
# than worker-02: worker-02 shares the 4-core nas host with control-plane-03 and
# TrueNAS, and when that host saturates (e.g. ArgoCD renders after a merge) the
# VM loses CPU to steal and Sendspin playback stutters. The Sendspin player finds
# MA via mDNS, so moving nodes needs no client change. The LoadBalancer below
# keeps the stable 192.168.1.223 for web clients (MA's base URL, Companion App)
# regardless of the node.
defaultPodOptions:
  # Tier: see cluster/apps/priority-classes/priority-classes.yaml. Voice + music
  # are nice-to-have; they yield first when a worker is drained.
  priorityClassName: kuberseni-low
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: worker-01

service:
  main:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      # First free IP in the Cilium LB pool .220-.229 (.220 plex, .221 mosquitto,
      # .222 traefik). Gives web clients one stable http://192.168.1.223:8095
      # regardless of which node the pod lands on.
      io.cilium/lb-ipam-ips: "192.168.1.223"
    ports:
      http:
        port: 8095

ingress:
  main:
    enabled: true
    className: traefik
    annotations:
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
    hosts:
      - host: &host musicassistant.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - *host
        secretName: music-assistant-tls

persistence:
  data:
    enabled: true
    existingClaim: music-assistant-data
    globalMounts:
      - path: /data
  # Local music library (Lidarr-managed), read-only. After this syncs, add a
  # "Filesystem" music provider in the MA UI pointing at /media/music to index it.
  music:
    enabled: true
    existingClaim: music-library
    globalMounts:
      - path: /media/music
        readOnly: true
