---
controllers:
  main:
    annotations:
      # app-template >=2 adds app.kubernetes.io/controller to the (immutable)
      # selector, so the Deployment must be deleted and recreated once.
      # TODO: drop this annotation once the 5.x rollout has synced.
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    replicas: 1
    strategy: RollingUpdate
    containers:
      main:
        image:
          repository: nodered/node-red
          tag: 4.1.11
        env:
          TZ: "Europe/London"
        probes:
          liveness: &probes
            enabled: true
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            cpu: 1
            memory: 1000Mi

defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"

service:
  main:
    controller: main
    ports:
      http:
        port: 1880

ingress:
  main:
    annotations:
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
    hosts:
      - host: nodered.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - secretName: nodered-tls
        hosts:
          - nodered.arsenikki.casa

persistence:
  data:
    existingClaim: node-red-data
