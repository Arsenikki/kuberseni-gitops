---
controller:
  type: statefulset
  annotations:
    # restart HA when home-assistant-config-yaml changes (subPath mounts never refresh)
    reloader.stakater.com/auto: "true"

image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: 2026.10.4

env:
  TZ: "Europe/London"

envFrom:
  - secretRef:
      name: argocd-dashboard

hostNetwork: true

service:
  main:
    ports:
      http:
        port: 8123
      homekit:
        port: 21063

ingress:
  main:
    enabled: true
    annotations:
      kubernetes.io/tls-acme: "true"
    hosts:
      - host: homeassistant.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: home-assistant-tls
        hosts:
          - homeassistant.arsenikki.casa

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: home-assistant-config
  configuration-yaml:
    enabled: true
    type: configMap
    name: home-assistant-config-yaml
    mountPath: /config/configuration.yaml
    subPath: configuration.yaml
    readOnly: true
  adaptive-lighting-config:
    enabled: true
    type: configMap
    name: home-assistant-config-yaml
    mountPath: /config/adaptive_lighting_config.yaml
    subPath: adaptive_lighting_config.yaml
    readOnly: true
  # HA packages (packages/*.yaml → ConfigMap home-assistant-packages). Mounted as
  # a whole directory, NOT subPath, so the kubelet updates files in place; the
  # packages-reload sidecar then asks HA to reload. Reloader ignores this
  # ConfigMap (annotation in kustomization.yaml), so package edits never restart HA.
  packages:
    enabled: true
    type: configMap
    name: home-assistant-packages
    mountPath: /config/packages
    readOnly: true

# Reloads HA when the packages ConfigMap changes. The kubelet swaps the
# ..data symlink atomically on every update; on change the sidecar calls HA's
# REST API directly (no HA automation in the loop, so a reload can never
# cancel itself): check_config first, and only if it is valid, reload each YAML
# domain packages use, helpers first and automations last. Only automations whose
# config changed are restarted, so pending for: timers elsewhere survive.
# Any failure is logged and retried on the next tick; nothing is reloaded from
# an invalid config. Needs HA_TOKEN (externalsecrets.yaml); until it exists the
# sidecar only logs that it is waiting.
sidecars:
  packages-reload:
    image: busybox:1.38
    command: ["/bin/sh", "-c"]
    args:
      - |
        HA=http://127.0.0.1:8123
        DOMAINS="input_boolean input_button input_datetime input_number input_select input_text timer script scene automation"
        api() { wget -q -O - --header="Authorization: Bearer $HA_TOKEN" --header="Content-Type: application/json" --post-data="{}" "$HA/api/$1"; }
        last="$(readlink /packages/..data)"
        echo "watching /packages (current: $last)"
        while sleep 5; do
          cur="$(readlink /packages/..data)"
          [ "$cur" = "$last" ] && continue
          if [ -z "${HA_TOKEN:-}" ]; then
            echo "packages changed ($cur) but HA_TOKEN is not set (1Password home-assistant/packages_reload_token); not reloading"
            last="$cur"
            continue
          fi
          if ! check="$(api config/core/check_config)"; then
            echo "packages changed but HA API not reachable yet; retrying"
            continue
          fi
          if ! echo "$check" | grep -q '"result": *"valid"'; then
            echo "packages changed ($cur) but check_config is NOT valid, refusing to reload: $check"
            last="$cur"
            continue
          fi
          failed=""
          for d in $DOMAINS; do
            # Stop at the first failure: later domains (automations) may depend on earlier ones.
            api "services/$d/reload" >/dev/null || { failed="$d"; break; }
          done
          if [ -n "$failed" ]; then
            echo "reload of $failed failed (later domains skipped); retrying"
            continue
          fi
          echo "packages changed ($last -> $cur): config valid, reloaded: $DOMAINS"
          last="$cur"
        done
    env:
      - name: HA_TOKEN
        valueFrom:
          secretKeyRef:
            name: home-assistant-packages-reload
            key: HA_TOKEN
            optional: true
    volumeMounts:
      - name: packages
        mountPath: /packages
        readOnly: true
    resources:
      requests:
        cpu: 1m
        memory: 8Mi
      limits:
        memory: 32Mi

# Household-critical: rank HA last for kubelet node-pressure eviction (it was
# evicted alongside paseo-generic when worker-01 hit DiskPressure 2026-11-10)
# and let it preempt lower-priority pods if its node is short on room.
priorityClassName: kuberseni-critical

# Default startup budget is 5s x 30 = 150s with a 1s TCP timeout; on a starved
# node HA core needs longer, and probe dials time out ("i/o timeout"). Give it
# 10s x 30 = 300s and slower-node-tolerant timeouts.
probes:
  startup:
    spec:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
  liveness:
    spec:
      timeoutSeconds: 5
  readiness:
    spec:
      timeoutSeconds: 5

resources:
  requests:
    # Was 10m -> cgroup cpu.weight ~1, so HA lost every CPU contention. 250m
    # still fits worker-02's remaining requestable CPU for the soft fallback.
    cpu: 250m
    memory: 100Mi
  limits:
    memory: 2000Mi

addons:
  codeserver:
    enabled: true
    image:
      repository: ghcr.io/coder/code-server
      tag: 4.95.3
      pullPolicy: IfNotPresent
    env:
      TZ: "Europe/London"
    args:
      - --auth
      - "none"
      - --user-data-dir
      - "/config/.vscode"
      - --extensions-dir
      - "/config/.vscode"
    volumeMounts:
      - name: config
        mountPath: /config
    ingress:
      enabled: true
      annotations:
        kubernetes.io/tls-acme: "true"
        traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
        external-dns/is-public: "true"
      hosts:
        - host: "code.homeassistant.arsenikki.casa"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: home-assistant-vscode-tls
          hosts:
            - "code.homeassistant.arsenikki.casa"
