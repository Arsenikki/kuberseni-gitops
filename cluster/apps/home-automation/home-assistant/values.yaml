---
controller:
  type: statefulset
  annotations:
    # restart HA when home-assistant-config-yaml changes (subPath mounts never refresh)
    reloader.stakater.com/auto: "true"

image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: 2026.10.4

env:
  TZ: "Europe/London"

envFrom:
  - secretRef:
      name: argocd-dashboard

hostNetwork: true

service:
  main:
    ports:
      http:
        port: 8123
      homekit:
        port: 21063

ingress:
  main:
    enabled: true
    annotations:
      kubernetes.io/tls-acme: "true"
    hosts:
      - host: homeassistant.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: home-assistant-tls
        hosts:
          - homeassistant.arsenikki.casa

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: home-assistant-config
  configuration-yaml:
    enabled: true
    type: configMap
    name: home-assistant-config-yaml
    mountPath: /config/configuration.yaml
    subPath: configuration.yaml
    readOnly: true
  adaptive-lighting-config:
    enabled: true
    type: configMap
    name: home-assistant-config-yaml
    mountPath: /config/adaptive_lighting_config.yaml
    subPath: adaptive_lighting_config.yaml
    readOnly: true

# Household-critical: rank HA last for kubelet node-pressure eviction (it was
# evicted alongside paseo-generic when worker-01 hit DiskPressure 2026-11-10)
# and let it preempt lower-priority pods if it has to fall back to worker-02.
priorityClassName: kuberseni-critical

# Prefer anything but worker-02: a 3-vCPU VM on the 4-core "nas" Proxmox host
# (7 vCPUs on 4 cores; 2026-11-10: load 61, 32% steal, 90% CPU PSI). There the
# HA python process got ~9s of CPU per 68s wall and never bound :8123 inside the
# startup window -> 15 restarts. Soft, so HA still schedules if worker-01 is
# down or tainted (same pattern as authentik).
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - worker-02

# Default startup budget is 5s x 30 = 150s with a 1s TCP timeout; on a starved
# node HA core needs longer, and probe dials time out ("i/o timeout"). Give it
# 10s x 30 = 300s and slower-node-tolerant timeouts.
probes:
  startup:
    spec:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
  liveness:
    spec:
      timeoutSeconds: 5
  readiness:
    spec:
      timeoutSeconds: 5

resources:
  requests:
    # Was 10m -> cgroup cpu.weight ~1, so HA lost every CPU contention. 250m
    # still fits worker-02's remaining requestable CPU for the soft fallback.
    cpu: 250m
    memory: 100Mi
  limits:
    memory: 2000Mi

addons:
  codeserver:
    enabled: true
    image:
      repository: ghcr.io/coder/code-server
      tag: 4.95.3
      pullPolicy: IfNotPresent
    env:
      TZ: "Europe/London"
    args:
      - --auth
      - "none"
      - --user-data-dir
      - "/config/.vscode"
      - --extensions-dir
      - "/config/.vscode"
    volumeMounts:
      - name: config
        mountPath: /config
    ingress:
      enabled: true
      annotations:
        kubernetes.io/tls-acme: "true"
        traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
        external-dns/is-public: "true"
      hosts:
        - host: "code.homeassistant.arsenikki.casa"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: home-assistant-vscode-tls
          hosts:
            - "code.homeassistant.arsenikki.casa"
