---
# Lobby candle lights follow the two lobby motion sensors (lobby_motion_sensor_01,
# formerly front_door_motion_sensor, and lobby_motion_sensor_02): on when either
# sees motion, off once neither has seen any for 2 minutes. Ported from the
# Node-RED "Lights" tab.
automation:
  - id: lobby_lights_follow_motion
    alias: "Lobby: lights follow motion"
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.lobby_motion_sensor_01_occupancy
          - binary_sensor.lobby_motion_sensor_02_occupancy
        to: "on"
        id: motion
      # Each sensor going quiet is a candidate; the condition below only lets the
      # last one through, once both have been clear for the full 2 minutes.
      - trigger: state
        entity_id:
          - binary_sensor.lobby_motion_sensor_01_occupancy
          - binary_sensor.lobby_motion_sensor_02_occupancy
        to: "off"
        for: "00:02:00"
        id: clear
    conditions:
      - condition: or
        conditions:
          - condition: trigger
            id: motion
          - condition: state
            entity_id:
              - binary_sensor.lobby_motion_sensor_01_occupancy
              - binary_sensor.lobby_motion_sensor_02_occupancy
            # A dead or missing sensor must not keep the lobby lit.
            state: ["off", "unavailable", "unknown"]
            for: "00:02:00"
    actions:
      - action: "light.turn_{{ 'on' if trigger.id == 'motion' else 'off' }}"
        target:
          entity_id:
            - light.lobby_candle_light_01
            - light.lobby_candle_light_02
            - light.lobby_candle_light_03

  # for: timers live in memory: a restart (or reloading the automation above)
  # while the 2-minute off-timer runs would leave the lobby lit until the next
  # motion. Re-arm it: lights on and no motion -> off unless motion within 2 min.
  - id: lobby_lights_off_after_restart
    alias: "Lobby: lights off after restart if no motion"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: state
        entity_id:
          - binary_sensor.lobby_motion_sensor_01_occupancy
          - binary_sensor.lobby_motion_sensor_02_occupancy
        state: ["off", "unavailable", "unknown"]
      - condition: state
        entity_id: [light.lobby_candle_light_01, light.lobby_candle_light_02, light.lobby_candle_light_03]
        match: any
        state: "on"
    actions:
      - wait_template: >-
          {{ is_state('binary_sensor.lobby_motion_sensor_01_occupancy', 'on')
             or is_state('binary_sensor.lobby_motion_sensor_02_occupancy', 'on') }}
        timeout: "00:02:00"
        continue_on_timeout: true
      - if:
          - "{{ not wait.completed }}"
        then:
          - action: light.turn_off
            target:
              entity_id:
                - light.lobby_candle_light_01
                - light.lobby_candle_light_02
                - light.lobby_candle_light_03
