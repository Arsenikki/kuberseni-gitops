---
# Live reload for this packages directory. The packages-reload sidecar (values.yaml)
# POSTs this local-only webhook after the kubelet updates /config/packages.
# Reloads the YAML domains packages may use, in dependency order (helpers first,
# automations last). Deliberately not homeassistant.reload_all: that also
# reloads HomeKit and briefly drops the Apple Home bridge.
# Only domains with a live reload action are listed (checked 2026-11-14:
# input_*, timer, script, scene, automation). A package using another
# domain (template, group, ...) must add it here; a brand-new non-reloadable
# integration still needs a restart.
automation:
  - id: packages_reload_on_change
    alias: "System: reload YAML packages"
    description: Triggered by the packages-reload sidecar when the packages ConfigMap changes.
    mode: queued
    max: 3
    triggers:
      - trigger: webhook
        webhook_id: reload_yaml_packages
        allowed_methods: [POST]
        local_only: true
    actions:
      - repeat:
          for_each:
            - input_boolean
            - input_button
            - input_datetime
            - input_number
            - input_select
            - input_text
            - timer
            - script
            - scene
            - automation
          sequence:
            - action: "{{ repeat.item }}.reload"
              continue_on_error: true
      - action: system_log.write
        data:
          level: info
          logger: packages
          message: YAML packages reloaded after a ConfigMap update
