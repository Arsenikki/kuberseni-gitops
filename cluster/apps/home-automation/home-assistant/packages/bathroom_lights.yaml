---
# Master bedroom bathroom: Gledopto MR16 bulbs (light.bathroom_all_lights, group
# in configuration.yaml) on a Hue dimmer switch gen 2 (zigbee2mqtt
# bathroom_wall_switch). White tones only, no colours. Kept out of Adaptive
# Lighting on purpose: the bathroom has its own brightness, independent of the
# rest of the house.
#   power press     toggle (on = current tone at 40 %, or the night light 00:30-06:00)
#   power hold      night light
#   up / down       brightness +/- 10 % (hold to keep going)
#   hue press       next tone: candle -> warm -> soft -> candle (brightness kept)
#   hue hold        bright work light and back to candle
# input_select.bathroom_light_tone holds the tone; changing it (UI, HomeKit)
# re-applies it while the lights are on. Bright is a work light: it reverts to
# candle when the lights go off.
script:
  bathroom_lights_apply:
    alias: "Bathroom: apply light tone"
    mode: restart
    fields:
      tone:
        description: candle, warm, soft, bright or night. Defaults to the selected tone.
        selector:
          select:
            options: [candle, warm, soft, bright, night]
      keep_brightness:
        description: Only change the tone, keep the current brightness.
        default: false
        selector:
          boolean:
    variables:
      kelvin: {candle: 2000, warm: 2400, soft: 2900, bright: 4000, night: 2000}
      brightness: {bright: 100, night: 3}
      selected: "{{ tone | default(states('input_select.bathroom_light_tone'), true) }}"
      data: >-
        {% set d = {'color_temp_kelvin': kelvin.get(selected, 2000), 'transition': 1.5} %}
        {{ d if keep_brightness | default(false)
           else dict(d, brightness_pct=brightness.get(selected, 40)) }}
    sequence:
      - action: light.turn_on
        target:
          entity_id: light.bathroom_all_lights
        data: "{{ data }}"

automation:
  - id: bathroom_wall_switch
    alias: "Bathroom: wall switch"
    mode: queued
    max: 10
    max_exceeded: silent
    triggers:
      - trigger: mqtt
        topic: zigbee2mqtt/bathroom_wall_switch/action
    variables:
      press: "{{ trigger.payload }}"
      lights_on: "{{ is_state('light.bathroom_all_lights', 'on') }}"
      tone: "{{ states('input_select.bathroom_light_tone') }}"
      tones_cycle: [candle, warm, soft]
      night: "{{ today_at('00:30') <= now() < today_at('06:00') }}"
    actions:
      - choose:
          # Power and hue buttons act on release, so a hold isn't also a press.
          - conditions: "{{ press == 'on_press_release' }}"
            sequence:
              - if:
                  - "{{ lights_on }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: light.bathroom_all_lights
                    data:
                      transition: 1
                else:
                  - action: script.bathroom_lights_apply
                    data:
                      tone: "{{ 'night' if night and tone != 'bright' else tone }}"

          - conditions: "{{ press == 'on_hold' }}"
            sequence:
              - action: script.bathroom_lights_apply
                data:
                  tone: night

          - conditions: "{{ press in ['off_press_release', 'off_hold'] }}"
            sequence:
              - variables:
                  next_tone: >-
                    {% if press == 'off_hold' %}
                      {{ 'candle' if tone == 'bright' else 'bright' }}
                    {% elif tone in tones_cycle %}
                      {{ tones_cycle[(tones_cycle.index(tone) + 1) % tones_cycle | length] }}
                    {% else %}
                      candle
                    {% endif %}
              - action: input_select.select_option
                target:
                  entity_id: input_select.bathroom_light_tone
                data:
                  option: "{{ next_tone }}"
              # While on, the tone change below applies it; from off, turn on here.
              - if:
                  - "{{ not lights_on }}"
                then:
                  - action: script.bathroom_lights_apply
                    data:
                      tone: "{{ next_tone }}"

          # Up/down fire on press and repeat while held. Only while on, and never
          # below 1 %: a brightness step to 0 would switch the lights off.
          - conditions: "{{ press in ['up_press', 'up_hold', 'down_press', 'down_hold'] and lights_on }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.bathroom_all_lights
                data:
                  brightness_pct: >-
                    {% set current = state_attr('light.bathroom_all_lights', 'brightness') | int(0) / 2.55 %}
                    {% set step = 10 if press.startswith('up') else -10 %}
                    {{ ([1, (current + step) | round, 100] | sort)[1] }}
                  transition: 0.4

  - id: bathroom_tone_changed
    alias: "Bathroom: apply tone when changed"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.bathroom_light_tone
    conditions:
      - condition: state
        entity_id: light.bathroom_all_lights
        state: "on"
    actions:
      # Cycling the warm tones keeps the brightness; the work light and leaving
      # it set their own.
      - action: script.bathroom_lights_apply
        data:
          keep_brightness: >-
            {{ trigger.to_state.state != 'bright' and trigger.from_state.state != 'bright' }}

  - id: bathroom_bright_reverts_to_candle
    alias: "Bathroom: work light back to candle when the lights go off"
    mode: single
    triggers:
      - trigger: state
        entity_id: light.bathroom_all_lights
        to: "off"
    conditions:
      - condition: state
        entity_id: input_select.bathroom_light_tone
        state: bright
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.bathroom_light_tone
        data:
          option: candle
