---
# Master bedroom bathroom: Gledopto MR16 RGB+CCT bulbs (light.bathroom_all_lights,
# group in configuration.yaml) on a Hue dimmer switch gen 2 (zigbee2mqtt
# bathroom_wall_switch). Kept out of Adaptive Lighting on purpose: the bathroom
# has its own moods and brightness, independent of the rest of the house.
#   power press     toggle (on = current mood, or the night light 00:30-06:00)
#   power hold      night light
#   up / down       brightness +/- 10 % (hold to keep going)
#   hue press       next mood: warm -> hot -> violet -> warm
#   hue hold        bright white (cold) and back to warm
# input_select.bathroom_mood_light_mode holds the mood; changing it (UI, HomeKit)
# re-applies it while the lights are on. Cold is a work light: it reverts to
# warm when the lights go off.
script:
  bathroom_lights_apply:
    alias: "Bathroom: apply light mood"
    mode: restart
    fields:
      mood:
        description: warm, hot, violet, cold or night. Defaults to the selected mood.
        selector:
          select:
            options: [warm, hot, violet, cold, night]
    variables:
      presets:
        warm: {color_temp_kelvin: 2200, brightness_pct: 40}    # candlelight
        hot: {rgb_color: [255, 70, 20], brightness_pct: 30}     # deep amber-red
        violet: {rgb_color: [170, 40, 255], brightness_pct: 25}
        cold: {color_temp_kelvin: 4000, brightness_pct: 100}    # mirror / cleaning
        night: {color_temp_kelvin: 2000, brightness_pct: 3}     # don't wake up fully
      selected: "{{ mood | default(states('input_select.bathroom_mood_light_mode'), true) }}"
    sequence:
      - action: light.turn_on
        target:
          entity_id: light.bathroom_all_lights
        data: "{{ dict(presets.get(selected, presets.warm), transition=1.5) }}"

automation:
  - id: bathroom_wall_switch
    alias: "Bathroom: wall switch"
    mode: queued
    max: 10
    max_exceeded: silent
    triggers:
      - trigger: mqtt
        topic: zigbee2mqtt/bathroom_wall_switch/action
    variables:
      press: "{{ trigger.payload }}"
      lights_on: "{{ is_state('light.bathroom_all_lights', 'on') }}"
      mood: "{{ states('input_select.bathroom_mood_light_mode') }}"
      moods_cycle: [warm, hot, violet]
      night: "{{ today_at('00:30') <= now() < today_at('06:00') }}"
    actions:
      - choose:
          # Power and hue buttons act on release, so a hold isn't also a press.
          - conditions: "{{ press == 'on_press_release' }}"
            sequence:
              - if:
                  - "{{ lights_on }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: light.bathroom_all_lights
                    data:
                      transition: 1
                else:
                  - action: script.bathroom_lights_apply
                    data:
                      mood: "{{ 'night' if night and mood != 'cold' else mood }}"

          - conditions: "{{ press == 'on_hold' }}"
            sequence:
              - action: script.bathroom_lights_apply
                data:
                  mood: night

          - conditions: "{{ press in ['off_press_release', 'off_hold'] }}"
            sequence:
              - variables:
                  next_mood: >-
                    {% if press == 'off_hold' %}
                      {{ 'warm' if mood == 'cold' else 'cold' }}
                    {% elif mood in moods_cycle %}
                      {{ moods_cycle[(moods_cycle.index(mood) + 1) % moods_cycle | length] }}
                    {% else %}
                      warm
                    {% endif %}
              - action: input_select.select_option
                target:
                  entity_id: input_select.bathroom_mood_light_mode
                data:
                  option: "{{ next_mood }}"
              # While on, the mood change below applies it; from off, turn on here.
              - if:
                  - "{{ not lights_on }}"
                then:
                  - action: script.bathroom_lights_apply
                    data:
                      mood: "{{ next_mood }}"

          # Up/down fire on press and repeat while held. Only while on, and never
          # below 1 %: a brightness step to 0 would switch the lights off.
          - conditions: "{{ press in ['up_press', 'up_hold', 'down_press', 'down_hold'] and lights_on }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.bathroom_all_lights
                data:
                  brightness_pct: >-
                    {% set current = state_attr('light.bathroom_all_lights', 'brightness') | int(0) / 2.55 %}
                    {% set step = 10 if press.startswith('up') else -10 %}
                    {{ ([1, (current + step) | round, 100] | sort)[1] }}
                  transition: 0.4

  - id: bathroom_mood_changed
    alias: "Bathroom: apply mood when changed"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.bathroom_mood_light_mode
    conditions:
      - condition: state
        entity_id: light.bathroom_all_lights
        state: "on"
    actions:
      - action: script.bathroom_lights_apply

  - id: bathroom_cold_reverts_to_warm
    alias: "Bathroom: cold mood back to warm when the lights go off"
    mode: single
    triggers:
      - trigger: state
        entity_id: light.bathroom_all_lights
        to: "off"
    conditions:
      - condition: state
        entity_id: input_select.bathroom_mood_light_mode
        state: cold
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.bathroom_mood_light_mode
        data:
          option: warm
