---
# input_select.adaptive_lighting_level picks which Adaptive Lighting profile
# (switch.adaptive_lighting_<level>, see adaptive_lighting_config.yaml) is active,
# then re-applies it to that profile's lights. Ported from the Node-RED "Lights" tab.
automation:
  - id: adaptive_lighting_level_select
    alias: "Adaptive lighting: apply selected level"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.adaptive_lighting_level
        to: [low, medium, high, maximum]
    variables:
      level: "{{ trigger.to_state.state }}"
    actions:
      - repeat:
          for_each: [low, medium, high, maximum]
          sequence:
            - action: "switch.turn_{{ 'on' if repeat.item == level else 'off' }}"
              target:
                entity_id: "switch.adaptive_lighting_{{ repeat.item }}"
      - delay:
          seconds: 1
      # Apply the selected profile to the lights it is configured for (the shared
      # `lights` list in configmap.yaml, which includes light.bedroom_light_01).
      # Node-RED passed every light, which also adapted the light groups.
      - action: adaptive_lighting.apply
        data:
          entity_id: "switch.adaptive_lighting_{{ level }}"
        continue_on_error: true

  - id: lights_nightly_reset
    alias: "Lights: nightly reset (04:00)"
    description: Scene back to normal, adaptive lighting back to medium, and movie lights toggle cleared every night.
    mode: single
    triggers:
      - trigger: time
        at: "04:00:00"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.scene
        data:
          option: normal
      - action: input_select.select_option
        target:
          entity_id: input_select.adaptive_lighting_level
        data:
          option: medium
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.living_room_movie_lights_active
