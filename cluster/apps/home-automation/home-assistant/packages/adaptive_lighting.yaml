---
# Adaptive Lighting zones (switch.adaptive_lighting_<zone>, see
# adaptive_lighting_config.yaml in configmap.yaml): living (kitchen, living room,
# lobby), bedroom and bathroom. input_select.adaptive_lighting_level sets the
# brightness/colour range of every zone; switches bump a single zone's lights
# (manual brightness control, cleared when the light turns off).
# Cozy = sleep mode in the bedroom and bathroom from 21:00 to 06:00, dimmed to a
# night light from 00:30.
# change_switch_settings doesn't survive a restart or reload, so it is re-applied
# then too.
script:
  adaptive_lighting_apply_zones:
    alias: "Adaptive lighting: apply level and cozy settings to every zone"
    mode: queued
    max: 5
    variables:
      level: "{{ states('input_select.adaptive_lighting_level') }}"
      ranges:
        low: {min_brightness: 1, max_brightness: 10, max_color_temp: 3000}
        medium: {min_brightness: 5, max_brightness: 40, max_color_temp: 4000}
        high: {min_brightness: 10, max_brightness: 80, max_color_temp: 5000}
        maximum: {min_brightness: 20, max_brightness: 100, max_color_temp: 5000}
      cozy_brightness: {low: 10, medium: 25, high: 40, maximum: 60}
      late_night: "{{ today_at('00:30') <= now() < today_at('06:00') }}"
      settings: >-
        {{ dict(ranges.get(level, ranges.medium), use_defaults='current',
                sleep_brightness=3 if late_night else cozy_brightness.get(level, 25),
                sleep_color_temp=2000 if late_night else 2200) }}
    sequence:
      - repeat:
          for_each: [living, bedroom, bathroom]
          sequence:
            - action: adaptive_lighting.change_switch_settings
              target:
                entity_id: "switch.adaptive_lighting_{{ repeat.item }}"
              data: "{{ settings }}"
              continue_on_error: true

automation:
  - id: adaptive_lighting_level_select
    alias: "Adaptive lighting: apply selected level"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.adaptive_lighting_level
        to: [low, medium, high, maximum]
    actions:
      - action: script.adaptive_lighting_apply_zones

  - id: adaptive_lighting_cozy_schedule
    alias: "Adaptive lighting: cozy bedroom and bathroom 21:00-06:00"
    mode: queued
    triggers:
      - trigger: time
        at: ["21:00:00", "00:30:00", "06:00:00"]
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    variables:
      cozy: "{{ now() >= today_at('21:00') or now() < today_at('06:00') }}"
    actions:
      # Settings first, so sleep mode turns on with tonight's cozy brightness.
      - action: script.adaptive_lighting_apply_zones
      - action: "switch.turn_{{ 'on' if cozy else 'off' }}"
        target:
          entity_id:
            - switch.adaptive_lighting_sleep_mode_bedroom
            - switch.adaptive_lighting_sleep_mode_bathroom
        continue_on_error: true

  - id: lights_nightly_reset
    alias: "Lights: nightly reset (04:00)"
    description: Scene back to normal and adaptive lighting back to medium every night.
    mode: single
    triggers:
      - trigger: time
        at: "04:00:00"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.scene
        data:
          option: normal
      - action: input_select.select_option
        target:
          entity_id: input_select.adaptive_lighting_level
        data:
          option: medium
