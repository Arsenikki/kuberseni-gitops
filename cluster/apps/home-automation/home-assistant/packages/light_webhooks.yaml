---
# GET webhooks that toggle lights (e.g. from phone shortcuts). Same webhook IDs
# as the Node-RED "Lights" tab, so existing callers keep working:
#   GET /api/webhook/kitchen_lights_toggle
#   GET /api/webhook/living_room_corner_lights_toggle
#   GET /api/webhook/living_room_christmas_lights_toggle
#   GET|POST /api/webhook/living_room_movie_lights
# local_only: these IDs are public in this repo, so only LAN clients may call them.
input_boolean:
  living_room_movie_lights_active:
    name: "Living room movie lights active"
    icon: mdi:movie-open-outline
    initial: false

script:
  living_room_movie_lights:
    alias: "Lights: toggle movie mode (kitchen & living room minimum brightness)"
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.living_room_movie_lights_active
            state: "on"
          - condition: template
            value_template: "{{ states('scene.living_room_movie_lights_before') not in ['unknown', 'unavailable'] }}"
        then:
          - action: scene.turn_on
            target:
              entity_id: scene.living_room_movie_lights_before
            continue_on_error: true
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_movie_lights_active
        else:
          - variables:
              available_lights: >-
                {{ [
                     'light.kitchen_led_strip_01',
                     'light.kitchen_led_strip_02',
                     'light.living_room_corner_light_01',
                     'light.living_room_corner_light_02',
                     'light.kitchen_countertop_lights',
                     'light.living_room_christmas_lights'
                   ] | reject('is_state', 'unavailable') | reject('is_state', 'unknown') | list }}
          - if:
              - condition: template
                value_template: "{{ available_lights | count > 0 }}"
            then:
              - action: scene.create
                data:
                  scene_id: living_room_movie_lights_before
                  snapshot_entities: "{{ available_lights }}"
          - action: light.turn_on
            target:
              entity_id:
                - light.kitchen_led_strip_01
                - light.kitchen_led_strip_02
                - light.living_room_corner_light_01
                - light.living_room_corner_light_02
            data:
              brightness_pct: 1
              transition: 2
            continue_on_error: true
          - repeat:
              for_each:
                - light.kitchen_countertop_lights
                - light.living_room_christmas_lights
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ is_state(repeat.item, 'on') }}"
                  then:
                    - action: light.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"
                      continue_on_error: true
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_movie_lights_active

automation:
  - id: light_webhooks
    alias: "Lights: toggle webhooks"
    mode: queued
    triggers:
      - trigger: webhook
        webhook_id: kitchen_lights_toggle
        allowed_methods: [GET]
        local_only: true
        id: kitchen
      - trigger: webhook
        webhook_id: living_room_corner_lights_toggle
        allowed_methods: [GET]
        local_only: true
        id: living_room_corner
      - trigger: webhook
        webhook_id: living_room_christmas_lights_toggle
        allowed_methods: [GET]
        local_only: true
        id: christmas
      - trigger: webhook
        webhook_id: living_room_movie_lights
        allowed_methods: [GET, POST]
        local_only: true
        id: movie
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: kitchen
            sequence:
              - action: script.lights_sync_toggle
                data:
                  entities: [light.kitchen_led_strip_01, light.kitchen_led_strip_02]
          - conditions:
              - condition: trigger
                id: living_room_corner
            sequence:
              - action: script.lights_sync_toggle
                data:
                  entities: [light.living_room_corner_light_01, light.living_room_corner_light_02]
          - conditions:
              - condition: trigger
                id: christmas
            sequence:
              - action: light.toggle
                target:
                  entity_id: light.living_room_christmas_lights
          - conditions:
              - condition: trigger
                id: movie
            sequence:
              - action: script.living_room_movie_lights
