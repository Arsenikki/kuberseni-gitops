---
# code-server SSH public key for VS Code access to Home Assistant config
# 1Password item: "home-assistant" field: ssh_public_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: code-server
  namespace: home-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: code-server
    creationPolicy: Owner
  data:
    - secretKey: id_rsa
      remoteRef:
        key: "home-assistant"
        property: ssh_public_key
---
# Read-only ArgoCD API bearer token for the dashboard apps widget.
# 1Password item: "argocd-dashboard" field: bearer (value: "Bearer <jwt>")
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dashboard
  namespace: home-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-dashboard
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_BEARER
      remoteRef:
        key: "argocd-dashboard"
        property: bearer
---
# HA long-lived access token for the packages-reload sidecar (values.yaml), used
# to run check_config and the per-domain reload actions after a packages change.
# 1Password item: "home-assistant" field: packages_reload_token (admin user's
# token, created in HA → Profile → Security → Long-lived access tokens).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-packages-reload
  namespace: home-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-packages-reload
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          # Only the sidecar uses this; rotating it must not restart HA.
          reloader.stakater.com/ignore: "true"
  data:
    - secretKey: HA_TOKEN
      remoteRef:
        key: "home-assistant"
        property: packages_reload_token
---
# Google Gemini API key for Home Assistant voice / conversation agent
# 1Password item: "gemini" field: api_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-gemini
  namespace: home-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-gemini
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: "gemini"
        property: api_key
