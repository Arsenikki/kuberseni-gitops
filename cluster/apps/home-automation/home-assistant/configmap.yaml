---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config-yaml
  namespace: home-automation
data:
  configuration.yaml: |
    # Version-controlled automations/scripts live in packages/ — one file per
    # package under cluster/apps/home-automation/home-assistant/packages/, shipped
    # as the home-assistant-packages ConfigMap and reloaded live by the
    # packages-reload sidecar (check_config, then per-domain reloads; no restart).
    # UI-made automations still go to automations.yaml on the PVC.
    homeassistant:
      packages: !include_dir_named packages

    # Loads default set of integrations. Do not remove.
    default_config:

    # Enable rest api for Temporal.io usage
    api:

    # Enable WoL integration
    wake_on_lan:

    # Configure reverse proxy
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16
        - 10.96.0.0/12
        - 192.168.1.0/24

    # Enable homekit integration
    homekit:
      - name: virtual_bridge
        filter:
          include_domains:
            - light
            - switch
          exclude_entity_globs:
            - switch.adaptive_lighting_adapt_*
            - switch.*_do_not_disturb
      - name: virtual_accessories
        port: 21065
        filter:
          include_domains:
            - media_player
          # Exposed through media_player.projector instead (packages/projector.yaml),
          # which wakes the projector over Wi-Fi so Siri's "turn on" works from standby.
          exclude_entities:
            - media_player.living_room_tv
        entity_config:
          media_player.projector:
            name: Living Room TV
            feature_list:
              - feature: on_off
              - feature: play_pause
              - feature: play_stop
              - feature: toggle_mute

    light:
    # Group lights into single entities
      - platform: group
        name: "kitchen_all_lights"
        entities:
          - light.kitchen_led_strip_01
          - light.kitchen_led_strip_02
      - platform: group
        name: "living_room_all_lights"
        entities:
          - light.living_room_corner_light_01
          - light.living_room_corner_light_02
      - platform: group
        name: "lobby_all_lights"
        entities:
          - light.lobby_candle_light_01
          - light.lobby_candle_light_02
          - light.lobby_candle_light_03

    # Configure selectors
    input_select:
      adaptive_lighting_level:
        options:
          - low
          - medium
          - high
          - maximum
        initial: medium
      scene:
        options:
          - normal
          - away
          - cleaning
          - spinning
        initial: normal
      bathroom_mood_light_mode:
        options:
          - cold
          - warm
          - hot
          - violet

    # Homelab infra reachability checks (up/down). Internal svc URLs bypass
    # Authentik; LAN hosts use verify_ssl:false for self-signed certs.
    binary_sensor:
      - platform: rest
        name: "ArgoCD"
        unique_id: infra_argocd
        resource: "http://argocd-server.argocd.svc/healthz"
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      - platform: rest
        name: "Authentik"
        unique_id: infra_authentik
        resource: "http://authentik-server.authentik.svc/-/health/live/"
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      - platform: rest
        name: "Longhorn"
        unique_id: infra_longhorn
        resource: "http://longhorn-frontend.longhorn-system.svc/"
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      - platform: rest
        name: "Plex Server"
        unique_id: infra_plex
        resource: "http://plex.media.svc.cluster.local:32400/identity"
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      # The router (gw, NixOS; replaced OPNSense 2026-11-23). No web UI, so probe its
      # node-exporter, which answers on the LAN. unique_id kept so the entity
      # (binary_sensor.opnsense) and its history stay.
      - platform: rest
        name: "Router (gw)"
        unique_id: infra_opnsense
        resource: "http://192.168.1.1:9100/metrics"
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      - platform: rest
        name: "TrueNAS"
        unique_id: infra_truenas
        resource: "https://192.168.1.2"
        verify_ssl: false
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      - platform: rest
        name: "Proxmox Router"
        unique_id: infra_proxmox_router
        resource: "https://192.168.1.10:8006"
        verify_ssl: false
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      - platform: rest
        name: "Proxmox MiniPC"
        unique_id: infra_proxmox_minipc
        resource: "https://192.168.1.11:8006"
        verify_ssl: false
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60
      - platform: rest
        name: "Proxmox NAS"
        unique_id: infra_proxmox_nas
        resource: "https://192.168.1.12:8006"
        verify_ssl: false
        device_class: connectivity
        value_template: "{{ true }}"
        timeout: 10
        scan_interval: 60

    # ArgoCD applications (read-only) for the dashboard apps table.
    # Token injected via ARGOCD_BEARER env (ESO -> argocd-dashboard secret).
    # fields= keeps the payload small enough for an HA attribute.
    rest:
      - resource: "http://argocd-server.argocd.svc/api/v1/applications?fields=items.metadata.name,items.status.sync.status,items.status.health.status"
        headers:
          Authorization: !env_var ARGOCD_BEARER
        scan_interval: 60
        timeout: 15
        sensor:
          - name: "ArgoCD Apps"
            unique_id: argocd_apps
            value_template: "{{ value_json['items'] | length if value_json else 0 }}"
            unit_of_measurement: "apps"
            json_attributes:
              - items

    # Living-room gaming remote control (Bazzite Moonlight launcher + Sunshine probe).
    rest_command:
      bazzite_gaming_status:
        url: "http://192.168.1.51:8765/status"
        method: GET
        timeout: 5
      bazzite_gaming_start:
        # Optional data: profile (auto|1080p|4k_hdr), app, restart. No data keeps the old defaults.
        url: "http://192.168.1.51:8765/start?profile={{ profile | default('auto') | urlencode }}&app={{ app | default('Steam Big Picture') | urlencode }}&restart={{ 'true' if (restart | default(false) | string | lower) in ['true', '1', 'yes', 'on'] else 'false' }}"
        method: POST
        timeout: 15
      bazzite_gaming_stop:
        url: "http://192.168.1.51:8765/stop"
        method: POST
        timeout: 15
      sunshine_serverinfo:
        url: "http://192.168.1.52:47989/serverinfo?uniqueid=0123456789ABCDEF&uuid=b34cf743351f4d1c8ee0911711f662d3"
        method: GET
        timeout: 2

    # Toggle Formovie projector Game Mode via ADB (trusted keypair in /config/.storage/adbkey{,.pub}).
    shell_command:
      projector_game_mode_on: >-
        python3 -c 'from adb_shell.adb_device import AdbDeviceTcp;
        from adb_shell.auth.sign_pythonrsa import PythonRSASigner;
        s = PythonRSASigner(open("/config/.storage/adbkey.pub").read(), open("/config/.storage/adbkey").read());
        d = AdbDeviceTcp("192.168.1.151", 5555, default_transport_timeout_s=5);
        d.connect(rsa_keys=[s], auth_timeout_s=5);
        d.shell("settings put global tv_picture_video_game_mode 1");
        d.close()'
      projector_game_mode_off: >-
        python3 -c 'from adb_shell.adb_device import AdbDeviceTcp;
        from adb_shell.auth.sign_pythonrsa import PythonRSASigner;
        s = PythonRSASigner(open("/config/.storage/adbkey.pub").read(), open("/config/.storage/adbkey").read());
        d = AdbDeviceTcp("192.168.1.151", 5555, default_transport_timeout_s=5);
        d.connect(rsa_keys=[s], auth_timeout_s=5);
        d.shell("settings put global tv_picture_video_game_mode 0");
        d.close()'
      projector_game_mode_toggle: >-
        python3 -c 'from adb_shell.adb_device import AdbDeviceTcp;
        from adb_shell.auth.sign_pythonrsa import PythonRSASigner;
        s = PythonRSASigner(open("/config/.storage/adbkey.pub").read(), open("/config/.storage/adbkey").read());
        d = AdbDeviceTcp("192.168.1.151", 5555, default_transport_timeout_s=5);
        d.connect(rsa_keys=[s], auth_timeout_s=5);
        cur = (d.shell("settings get global tv_picture_video_game_mode") or "").strip();
        d.shell("settings put global tv_picture_video_game_mode " + ("0" if cur == "1" else "1"));
        d.close()'
      # Switch Samsung HW-Q990H (reserved at .152) via local HTTPS JSON-RPC (port 1516).
      soundbar_input_hdmi1: >-
        python3 -c 'import urllib.request, ssl, json;
        ctx = ssl._create_unverified_context();
        rpc = lambda m, p=None: json.loads(urllib.request.urlopen(urllib.request.Request("https://192.168.1.152:1516/", data=json.dumps({"jsonrpc": "2.0", "method": m, "id": 1, **({"params": p} if p is not None else {})}, separators=(",", ":")).encode(), headers={"Content-Type": "application/json", "Accept": "application/json"}), context=ctx, timeout=5).read());
        tok = rpc("createAccessToken")["result"]["AccessToken"];
        rpc("inputSelectControl", {"AccessToken": tok, "inputSource": "HDMI_IN1"})'
      soundbar_input_arc: >-
        python3 -c 'import urllib.request, ssl, json;
        ctx = ssl._create_unverified_context();
        rpc = lambda m, p=None: json.loads(urllib.request.urlopen(urllib.request.Request("https://192.168.1.152:1516/", data=json.dumps({"jsonrpc": "2.0", "method": m, "id": 1, **({"params": p} if p is not None else {})}, separators=(",", ":")).encode(), headers={"Content-Type": "application/json", "Accept": "application/json"}), context=ctx, timeout=5).read());
        tok = rpc("createAccessToken")["result"]["AccessToken"];
        rpc("inputSelectControl", {"AccessToken": tok, "inputSource": "ARC"})'

    # Import other configs
    adaptive_lighting: !include adaptive_lighting_config.yaml
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

  adaptive_lighting_config.yaml: |
    - name: "Low"
      lights: &lights [
        light.kitchen_led_strip_01,
        light.kitchen_led_strip_02,
        light.living_room_corner_light_01,
        light.living_room_corner_light_02,
        light.lobby_candle_light_01,
        light.lobby_candle_light_02,
        light.lobby_candle_light_03,
        light.bedroom_light_01
      ]
      prefer_rgb_color: false
      transition: 45
      initial_transition: 1
      interval: 90
      min_brightness: 1
      max_brightness: 10
      min_color_temp: 2500
      max_color_temp: 3000
      sleep_brightness: 1
      sleep_color_temp: 1000
      take_over_control: true
      detect_non_ha_changes: false
      adapt_only_on_bare_turn_on: true

    - name: "Medium"
      lights: *lights
      prefer_rgb_color: false
      transition: 45
      initial_transition: 1
      interval: 90
      min_brightness: 5
      max_brightness: 40
      min_color_temp: 2500
      max_color_temp: 4000
      sleep_brightness: 1
      sleep_color_temp: 1000
      take_over_control: true
      detect_non_ha_changes: false
      adapt_only_on_bare_turn_on: true

    - name: "High"
      lights: *lights
      prefer_rgb_color: false
      transition: 45
      initial_transition: 1
      interval: 90
      min_brightness: 10
      max_brightness: 80
      min_color_temp: 2500
      max_color_temp: 5000
      sleep_brightness: 1
      sleep_color_temp: 1000
      take_over_control: true
      detect_non_ha_changes: false
      adapt_only_on_bare_turn_on: true

    - name: "Maximum"
      lights: *lights
      prefer_rgb_color: false
      transition: 45
      initial_transition: 1
      interval: 90
      min_brightness: 20
      max_brightness: 100
      min_color_temp: 2500
      max_color_temp: 5000
      sleep_brightness: 1
      sleep_color_temp: 1000
      take_over_control: true
      detect_non_ha_changes: false
      adapt_only_on_bare_turn_on: true
