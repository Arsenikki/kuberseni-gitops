---
controllers:
  main:
    type: deployment
    containers:
      main:
        image:
          repository: ghcr.io/koenkk/zigbee2mqtt
          tag: 2.14.3
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/London
          ZIGBEE2MQTT_DATA: /config
          ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "true"
          ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_DISCOVERY_TOPIC: homeassistant
          ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_STATUS_TOPIC: homeassistant/status
          ZIGBEE2MQTT_CONFIG_ADVANCED_LAST_SEEN: ISO_8601
          ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL: info
          ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_OUTPUT: '["console"]'
          # Timeouts alone don't enable availability in z2m 2.x.
          ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
          ZIGBEE2MQTT_CONFIG_AVAILABILITY_ACTIVE_TIMEOUT: 60
          ZIGBEE2MQTT_CONFIG_AVAILABILITY_PASSIVE_TIMEOUT: 2000
          # device_options has no sub-properties in the z2m schema, so per-key env
          # vars (..._DEVICE_OPTIONS_RETAIN) are silently ignored: set the whole
          # object as JSON. Must stay valid JSON or z2m won't start. Env values are
          # persisted to configuration.yaml, so revert with '{"retain":false}'.
          ZIGBEE2MQTT_CONFIG_DEVICE_OPTIONS: '{"retain":true}'
          ZIGBEE2MQTT_CONFIG_MQTT_INCLUDE_DEVICE_INFORMATION: "true"
          ZIGBEE2MQTT_CONFIG_MQTT_KEEPALIVE: 60
          ZIGBEE2MQTT_CONFIG_MQTT_REJECT_UNAUTHORIZED: "true"
          ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto.home-automation.svc.cluster.local
          # MQTT credentials from the shared mosquitto-credentials Secret (ESO).
          # Safe during PHASE 1: the broker still allows anonymous, and once the
          # password_file exists these creds authenticate the zigbee2mqtt user.
          ZIGBEE2MQTT_CONFIG_MQTT_USER:
            valueFrom:
              secretKeyRef:
                name: mosquitto-credentials
                key: ZIGBEE2MQTT_USERNAME
          ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: mosquitto-credentials
                key: ZIGBEE2MQTT_PASSWORD
          ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ember
          ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE: 115200
          ZIGBEE2MQTT_CONFIG_SERIAL_PORT: tcp://zigbee-serial-proxy.home-automation.svc.cluster.local:8888
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 500Mi

service:
  main:
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    ingressClassName: traefik
    annotations:
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
    hosts:
      - host: &host zigbee.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
            service:
              name: main
              port: http
    tls:
      - hosts:
          - *host
        secretName: zigbee2mqtt-tls

persistence:
  config:
    enabled: true
    existingClaim: zigbee2mqtt
    globalMounts:
      - path: /config
