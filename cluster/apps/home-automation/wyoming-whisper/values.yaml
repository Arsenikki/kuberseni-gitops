---
controllers:
  main:
    type: statefulset
    containers:
      main:
        image:
          repository: rhasspy/wyoming-whisper
          tag: 3.9.1
          pullPolicy: IfNotPresent
        args:
          - --model
          - small-int8
          - --language
          - en
          - --uri
          - tcp://0.0.0.0:10300
          - --data-dir
          - /data
          - --download-dir
          - /data
        env:
          TZ: Europe/London
        resources:
          requests:
            # 14d p99 ~0, max 147m; 750Mi peak memory (2026-11-26). Was 500m / 1Gi.
            cpu: 50m
            memory: 768Mi
          limits:
            memory: 2Gi

defaultPodOptions:
  # Tier: see cluster/apps/priority-classes/priority-classes.yaml. Voice + music
  # are nice-to-have; they yield first when a worker is drained.
  priorityClassName: kuberseni-low
  nodeSelector:
    kubernetes.io/hostname: worker-01

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      wyoming:
        port: 10300
        protocol: TCP

persistence:
  data:
    enabled: true
    existingClaim: wyoming-whisper-data
    globalMounts:
      - path: /data
