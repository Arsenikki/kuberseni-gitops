---
controllers:
  main:
    type: statefulset
    containers:
      main:
        image:
          repository: rhasspy/wyoming-whisper
          tag: 3.9.1
          pullPolicy: IfNotPresent
        args:
          - --model
          - small-int8
          - --language
          - en
          - --uri
          - tcp://0.0.0.0:10300
          - --data-dir
          - /data
          - --download-dir
          - /data
        env:
          TZ: Europe/London
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi

defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: worker-01

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      wyoming:
        port: 10300
        protocol: TCP

persistence:
  data:
    enabled: true
    existingClaim: wyoming-whisper-data
    globalMounts:
      - path: /data
