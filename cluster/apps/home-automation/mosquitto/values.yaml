---
controllers:
  main:
    annotations:
      # app-template >=2 adds app.kubernetes.io/controller to the (immutable)
      # selector, so the Deployment must be deleted and recreated once.
      # TODO: drop this annotation once the 5.x rollout has synced.
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    # initContainer builds the hashed mosquitto password_file from the plaintext
    # credentials synced by ESO (Secret: mosquitto-credentials). The file is written
    # to the shared "auth" emptyDir which the main container mounts at /mosquitto/auth.
    initContainers:
      gen-passwd:
        image:
          repository: eclipse-mosquitto
          tag: 2.0.22
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            PASSWD=/mosquitto/auth/passwd
            # -c creates/overwrites the file for the first user, then append the rest.
            mosquitto_passwd -b -c "$PASSWD" "$HOMEASSISTANT_USERNAME" "$HOMEASSISTANT_PASSWORD"
            mosquitto_passwd -b    "$PASSWD" "$ZIGBEE2MQTT_USERNAME"   "$ZIGBEE2MQTT_PASSWORD"
            mosquitto_passwd -b    "$PASSWD" "$NODERED_USERNAME"       "$NODERED_PASSWORD"
            mosquitto_passwd -b    "$PASSWD" "$PHILIPS_USERNAME"       "$PHILIPS_PASSWORD"
            chmod 0600 "$PASSWD"
        envFrom:
          - secretRef:
              name: mosquitto-credentials
    containers:
      main:
        image:
          repository: eclipse-mosquitto
          tag: 2.0.22
        probes:
          liveness: &probes
            enabled: true
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 15m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 124Mi

defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      # Pin to the IP Cilium LB-IPAM already assigned this service.
      # (Was mis-indented as a sibling of annotations:, so the request was
      # ignored and Cilium auto-assigned .221 — now made explicit.)
      io.cilium/lb-ipam-ips: "192.168.1.221"
    ports:
      http:
        port: 1883

configMaps:
  config:
    # Keep the pre-5.x name so the rendered ConfigMap is not renamed.
    forceRename: mosquitto-config
    data:
      mosquitto.conf: |
        listener 1883
        allow_anonymous false
        password_file /mosquitto/auth/passwd
        persistence true
        persistence_location /data
        connection_messages false
        autosave_interval 1800

persistence:
  data:
    existingClaim: mosquitto-data
    advancedMounts:
      main:
        main:
          - path: /data
  config-file:
    type: configMap
    identifier: config
    advancedMounts:
      main:
        main:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
  # Shared emptyDir holding the generated password_file, mounted into both the
  # main container and the gen-passwd initContainer.
  auth:
    type: emptyDir
    globalMounts:
      - path: /mosquitto/auth
