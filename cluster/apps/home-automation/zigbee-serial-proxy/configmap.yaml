apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee-serial-proxy-config
  namespace: home-automation
  labels:
    app.kubernetes.io/name: zigbee-serial-proxy
data:
  ser2net.yaml: |
    %YAML 1.1
    ---
    connection: &zigbee
      accepter: tcp,8888
      enable: on
      options:
        kickolduser: true
      connector: serialdev,/dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20231219170448-if00,115200n81,local
