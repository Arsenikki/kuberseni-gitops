apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee-serial-proxy
  namespace: home-automation
  labels:
    app.kubernetes.io/name: zigbee-serial-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee-serial-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee-serial-proxy
    spec:
      priorityClassName: kuberseni-critical
      nodeSelector:
        kubernetes.io/hostname: "control-plane-01"
      tolerations:
        - key: CriticalAddonsOnly
          operator: "Exists"
        - key: node-role.kubernetes.io/control-plane
          operator: "Exists"
      containers:
        - name: ser2net
          image: ghcr.io/jippi/docker-ser2net:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - name: serial-tcp
              containerPort: 8888
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ser2net/ser2net.yaml
              subPath: ser2net.yaml
              readOnly: true
            # Mount the host's /dev (devtmpfs) rather than /dev/serial/by-id.
            # udev removes /dev/serial/by-id whenever the last USB serial device
            # disconnects and creates a new inode when it re-enumerates; a bind
            # mount on /dev/serial/by-id stays pinned to the unlinked empty dir
            # and also misses new /dev/ttyACM* device nodes.
            - name: dev
              mountPath: /dev
      volumes:
        - name: config
          configMap:
            name: zigbee-serial-proxy-config
        - name: dev
          hostPath:
            path: /dev
            type: Directory
