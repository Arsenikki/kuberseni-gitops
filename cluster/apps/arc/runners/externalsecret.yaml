---
# GitHub App credentials ARC uses to register runners (githubConfigSecret in
# values.yaml). One App installation covers every selected repo, so all scale sets
# share this one Secret.
#
# 1Password item "arc-github-app" (homelab vault), fields:
#   github_app_id              — numeric App ID
#   github_app_installation_id — the installation on the Arsenikki account
#   github_app_private_key     — the App's private key (full PEM)
# REQUIRED before merge: create the App + item with
#   infra/scripts/arc-github-app (see cluster/apps/arc/README.md). Without the
#   item this ExternalSecret reports SecretSyncedError and no listener starts.
#
# The App has Repository permissions Administration: read/write + Metadata: read
# (what repo-level runner registration needs) on the selected repos only. That
# key is repo-admin on those repos — keep the repo selection tight.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: "arc-github-app"
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: "arc-github-app"
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: "arc-github-app"
        property: github_app_private_key
