---
# resepti API + embedded PWA. Serves the installable frontend and drives the
# in-cluster Paseo daemon (resepti-paseo) to run the import + cooking-assistant
# agents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resepti-api
  namespace: resepti
  labels:
    app.kubernetes.io/part-of: resepti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resepti-api
  template:
    metadata:
      labels:
        app: resepti-api
        app.kubernetes.io/part-of: resepti
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - "until pg_isready -h resepti-postgres -U resepti -d resepti; do echo waiting for db; sleep 2; done"
      containers:
        - name: api
          image: ghcr.io/arsenikki/resepti:0.1.8
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/resepti", "serve"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resepti-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://resepti:$(POSTGRES_PASSWORD)@resepti-postgres:5432/resepti?sslmode=disable"
            - name: HTTP_ADDR
              valueFrom: { configMapKeyRef: { name: resepti-config, key: HTTP_ADDR } }
            - name: ALLOWED_ORIGINS
              valueFrom: { configMapKeyRef: { name: resepti-config, key: ALLOWED_ORIGINS } }
            - name: PUBLIC_BASE_URL
              valueFrom: { configMapKeyRef: { name: resepti-config, key: PUBLIC_BASE_URL } }
            - name: PASEO_HOST
              valueFrom: { configMapKeyRef: { name: resepti-config, key: PASEO_HOST } }
            - name: PASEO_PORT
              valueFrom: { configMapKeyRef: { name: resepti-config, key: PASEO_PORT } }
            - name: RECIPE_CWD
              valueFrom: { configMapKeyRef: { name: resepti-config, key: RECIPE_CWD } }
            - name: IMPORT_PROVIDER
              valueFrom: { configMapKeyRef: { name: resepti-config, key: IMPORT_PROVIDER } }
            - name: IMPORT_EFFORT
              valueFrom: { configMapKeyRef: { name: resepti-config, key: IMPORT_EFFORT } }
            - name: IMPORT_MODE
              valueFrom: { configMapKeyRef: { name: resepti-config, key: IMPORT_MODE } }
            - name: ASSISTANT_PROVIDER
              valueFrom: { configMapKeyRef: { name: resepti-config, key: ASSISTANT_PROVIDER } }
            - name: ASSISTANT_MODE
              valueFrom: { configMapKeyRef: { name: resepti-config, key: ASSISTANT_MODE } }
            - name: S3_ENDPOINT
              valueFrom: { configMapKeyRef: { name: resepti-config, key: S3_ENDPOINT } }
            - name: S3_BUCKET
              valueFrom: { configMapKeyRef: { name: resepti-config, key: S3_BUCKET } }
            - name: S3_USE_SSL
              valueFrom: { configMapKeyRef: { name: resepti-config, key: S3_USE_SSL } }
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: resepti-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: resepti-secrets
                  key: S3_SECRET_KEY
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resepti-api
  namespace: resepti
  labels:
    app.kubernetes.io/part-of: resepti
spec:
  type: ClusterIP
  selector:
    app: resepti-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
