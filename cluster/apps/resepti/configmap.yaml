---
# Non-secret runtime config shared by the resepti services. Secrets (Postgres
# password, Claude token, S3 creds) come from the ExternalSecret `resepti-secrets`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: resepti-config
  namespace: resepti
  labels:
    app.kubernetes.io/part-of: resepti
data:
  HTTP_ADDR: ":8080"
  MCP_ADDR: ":9090"
  ALLOWED_ORIGINS: "*"
  PUBLIC_BASE_URL: "https://resepti.arsenikki.casa"
  # The API drives the shared paseo-apps daemon over TCP (cross-namespace).
  PASEO_HOST: "paseo-apps.paseo-apps.svc.cluster.local"
  PASEO_PORT: "6767"
  # Agent cwd on paseo-apps: the resepti workspace mounted there from the
  # resepti-workspace ConfigMap (.mcp.json + CLAUDE.md/GEMINI.md + settings.json).
  RECIPE_CWD: "/workspaces/resepti"
  # In-cluster URL of the resepti MCP server, interpolated into the workspace
  # .mcp.json by the agent process running on the daemon.
  RESEPTI_MCP_URL: "http://resepti-mcp:9090"
  # Agents run on AI-Pro/Gemini via paseo-apps' antigravity provider (sandboxed:
  # MCP + WebFetch, no shell). A capable model for import+review, a fast one for voice.
  IMPORT_PROVIDER: "antigravity/gemini-3.8-flash-high"
  IMPORT_EFFORT: "low"
  ASSISTANT_PROVIDER: "antigravity/gemini-3.8-flash-low"
  # Agent execution mode. antigravity's only mode is "full-access" (the Claude
  # default "bypassPermissions" is rejected: AGENT_CREATE_FAILED). The agy sandbox
  # (AGY_FORCE_SANDBOX on paseo-apps) still blocks shell regardless of this.
  IMPORT_MODE: "full-access"
  ASSISTANT_MODE: "full-access"
  # SeaweedFS/S3 media storage (recipe photos).
  S3_ENDPOINT: "seaweedfs-s3.monitoring:8333"
  S3_BUCKET: "resepti-media"
  S3_USE_SSL: "false"
