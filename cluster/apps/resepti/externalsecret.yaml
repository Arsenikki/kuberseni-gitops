---
# Assembles the Kubernetes secret `resepti-secrets` from 1Password (vault
# "homelab") via the `onepassword` ClusterSecretStore.
#
# REUSED existing items (no action needed):
#   - Claude token  → "Jeeves Agent" / claude_code_oauth_token (same as jeeves/coachi)
#   - S3 media creds → "seaweedfs-s3" / access_key + secret_key
#
# The ONLY new secret to add: create an item "resepti" with a single field:
#   - postgres_password   (any strong value; used by the db + api + mcp)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resepti-secrets
  namespace: resepti
  labels:
    app.kubernetes.io/part-of: resepti
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: resepti-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "resepti"
        property: postgres_password
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: "Jeeves Agent"
        property: claude_code_oauth_token
    # SeaweedFS S3 creds (shared object store) for recipe photos.
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: secret_key
