---
# Assembles the Kubernetes secret `resepti-secrets` from 1Password (vault
# "homelab") via the `onepassword` ClusterSecretStore.
#
# REUSED existing items — NO new 1Password secret needed:
#   - Postgres password → "coachi" / postgres_password (shared with coachi's DB by
#     request). ⚠️ If coachi's postgres_password is ever rotated, resepti's already-
#     initialised DB keeps the old value — update resepti's secret + DB together.
#   - Claude token      → "Jeeves Agent" / claude_code_oauth_token (same as jeeves/coachi)
#   - S3 media creds     → "seaweedfs-s3" / access_key + secret_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resepti-secrets
  namespace: resepti
  labels:
    app.kubernetes.io/part-of: resepti
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: resepti-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "coachi"
        property: postgres_password
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: "Jeeves Agent"
        property: claude_code_oauth_token
    # SeaweedFS S3 creds (shared object store) for recipe photos.
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: "seaweedfs-s3"
        property: secret_key
