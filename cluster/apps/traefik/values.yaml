---
deployment:
  kind: DaemonSet

service:
  enabled: true
  annotations:
    # Transition IP — old cluster owns 192.168.1.200; update to 200 at cutover
    io.cilium/lb-ipam-ips: "192.168.1.222"
  # Chart 43+ validates values against its schema; the type belongs under spec
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Cluster

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

log:
  level: DEBUG

accessLog:
  enabled: true
  fields:
    headers:
      defaultMode: keep

additionalArguments:
  - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.0.0.0/8,192.168.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,172.64.0.0/13,131.0.72.0/22,104.16.0.0/13,104.24.0.0/14"
  - "--metrics.prometheus=true"
  - "--entryPoints.metrics.address=:9100"
  - "--metrics.prometheus.entryPoint=metrics"
  - "--entryPoints.web.http.redirections.entryPoint.to=:443"
  - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
  - "--entryPoints.web.http.redirections.entryPoint.permanent=true"

securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

podSecurityContext:
  runAsUser: 568
  runAsGroup: 568
  runAsNonRoot: false
  fsGroup: 568

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: "Exists"
  - key: CriticalAddonsOnly
    operator: "Exists"

resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    memory: 500Mi

# Tier: see cluster/apps/priority-classes/priority-classes.yaml
priorityClassName: kuberseni-critical

# In-cluster ClusterIP Service `traefik-metrics` (port `metrics`, :9100) for the
# traefik ServiceMonitor in cluster/apps/monitoring/observability/servicemonitors.yaml.
# The main `traefik` Service is the public LoadBalancer, so metrics stay off it.
metrics:
  prometheus:
    service:
      enabled: true
