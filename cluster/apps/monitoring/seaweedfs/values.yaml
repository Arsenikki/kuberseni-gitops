---
# SeaweedFS S3 object store for the observability stack (in-cluster, single-node).
# All persistence on Longhorn — the chart defaults to hostPath (/ssd, /storage) which
# does NOT exist on Talos' read-only rootfs.

master:
  replicas: 1
  # 200 (chart default 1000): with `maxVolumes: 0` the volume server's slot count is
  # disk / volumeSizeLimit → 20Gi/1000MB = 19 slots, and each collection (= bucket)
  # grows 7 volumes at a time. With 3 collections holding 19/19 slots (only ~2.2 GiB
  # of real data), any other bucket failed to grow ("Not enough data nodes found!"):
  # mimir-ruler writes 504'd and the ruler crashlooped, so no alerts fired.
  # 200MB → ~100 slots. Files are chunked, so smaller volumes cost nothing.
  volumeSizeLimitMB: 200
  data:
    type: "persistentVolumeClaim"
    size: "2Gi"
    storageClass: "longhorn"
  logs:
    type: "emptyDir"

volume:
  replicas: 1
  dataDirs:
    # 20Gi (was 80Gi): the store holds only ~1.5 GiB of live data (mimir/loki/tempo
    # S3 chunks under 7d retention). 80Gi was wildly over-provisioned — it let the
    # volume quietly bloat and, because Longhorn schedules replicas by SPEC size, it
    # could not fit a 2nd replica on worker-02 (stuck degraded). 20Gi is ~10x live
    # usage and lets the volume become redundant. NOTE: shrinking a Longhorn PVC is
    # not supported in place — requires deleting the StatefulSet + PVC to recreate.
    - name: data1
      type: "persistentVolumeClaim"
      storageClass: "longhorn"
      size: "20Gi"
      maxVolumes: 0
  idx:
    type: "persistentVolumeClaim"
    size: "5Gi"
    storageClass: "longhorn"
  logs:
    type: "emptyDir"

filer:
  replicas: 1
  data:
    type: "persistentVolumeClaim"
    size: "5Gi"
    storageClass: "longhorn"
  logs:
    type: "emptyDir"

# S3 gateway → service seaweedfs-s3.monitoring.svc:8333 (plain HTTP, in-cluster only).
s3:
  enabled: true
  replicas: 1
  port: 8333
  # Logs default to hostPath /storage — read-only on Talos. Use emptyDir.
  logs:
    type: "emptyDir"
  enableAuth: true
  # JSON identity config templated from 1Password by ESO (see externalsecrets.yaml).
  existingConfigSecret: "seaweedfs-s3-config"
  # Declaratively pre-create the buckets. Mimir requires SEPARATE buckets for
  # blocks / ruler / alertmanager; Loki shares one bucket (chunks + ruler);
  # Tempo stores trace blocks in its own bucket.
  createBuckets:
    - name: mimir-blocks
    - name: mimir-ruler
    - name: mimir-alertmanager
    - name: loki-data
    - name: tempo-data
