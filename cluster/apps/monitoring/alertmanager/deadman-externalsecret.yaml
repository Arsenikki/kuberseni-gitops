---
# healthchecks.io ping URL for the Watchdog dead-man switch (see the `deadman` route in
# externalsecret.yaml). Kept separate from alertmanager-config so that a missing
# 1Password item can't break the main config, and mounted `optional` for the same reason.
#
# 1Password item "healthchecks.io" (vault homelab), property:
#   alertmanager_ping_url — https://hc-ping.com/<uuid> of the "Alertmanager watchdog" check
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadman
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-deadman
    creationPolicy: Owner
  data:
    - secretKey: ping_url
      remoteRef:
        key: "healthchecks.io"
        property: alertmanager_ping_url
