---
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
      # app-template 4.x renamed the (immutable) selector label
      # app.kubernetes.io/component -> app.kubernetes.io/controller, so the
      # Deployment must be deleted and recreated once.
      # TODO: drop this annotation once the 5.x rollout has synced.
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    serviceAccount:
      identifier: homepage
    pod:
      # The kubernetes widget talks to the API (see rbac.yaml); 5.x no longer
      # mounts the token by default.
      automountServiceAccountToken: true
    containers:
      main:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v1.13.2
        env:
          TZ: "Europe/London"
          HOMEPAGE_ALLOWED_HOSTS: "home.arsenikki.casa"
        probes:
          liveness: &probes
            enabled: true
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        envFrom:
          - secretRef:
              name: homepage-secrets
        resources:
          requests:
            cpu: 15m
            memory: 250M
          limits:
            memory: 1G

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

ingress:
  main:
    className: traefik
    annotations:
      kubernetes.io/tls-acme: "true"
      external-dns/is-public: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "authentik-forward-auth@kubernetescrd"
    hosts:
      - host: &host home.arsenikki.casa
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - *host
        secretName: homepage-tls

persistence:
  config:
    type: configMap
    name: homepage-config
    globalMounts:
      - subPath: bookmarks.yaml
        path: /app/config/bookmarks.yaml
      - subPath: docker.yaml
        path: /app/config/docker.yaml
      - subPath: kubernetes.yaml
        path: /app/config/kubernetes.yaml
      - subPath: services.yaml
        path: /app/config/services.yaml
      - subPath: settings.yaml
        path: /app/config/settings.yaml
      - subPath: widgets.yaml
        path: /app/config/widgets.yaml

serviceAccount:
  homepage: {}
