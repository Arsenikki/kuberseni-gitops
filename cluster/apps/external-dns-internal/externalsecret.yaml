---
# TSIG secret shared with the router's Knot (infra/nixos/hosts/gw/secrets.yaml,
# knot_tsig). 1Password item "external-dns-tsig", field "secret".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-tsig
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: external-dns-tsig
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: "external-dns-tsig"
        property: secret
