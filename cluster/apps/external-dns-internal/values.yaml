---
# Second external-dns: writes every arsenikki.casa name (ingresses + DNSEndpoints,
# public or not) into the router's local zone over RFC 2136, so the LAN resolves its
# own services without the internet. See infra/nixos/README.md (split-horizon DNS).
# The main external-dns keeps managing Cloudflare.
fullnameOverride: external-dns-internal

provider:
  name: rfc2136

domainFilters:
  - "arsenikki.casa"

env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: external-dns-tsig
        key: secret

extraArgs:
  - --rfc2136-host=192.168.1.1
  - --rfc2136-port=5300
  - --rfc2136-zone=arsenikki.casa
  - --rfc2136-tsig-keyname=external-dns
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-tsig-axfr
  - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
  - --crd-source-kind=DNSEndpoint
  - --ignore-ingress-tls-spec

policy: sync
sources: ["crd", "ingress"]
# Distinct owner, so the two instances never touch each other's records.
txtOwnerId: internal
txtPrefix: "k8s."

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
