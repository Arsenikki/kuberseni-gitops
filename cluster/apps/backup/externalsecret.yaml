---
# Assembles a complete rclone.conf for the offsite backup job from two 1Password
# items in the homelab vault:
#
#   1. "seaweedfs-s3"  (existing)  — access_key, secret_key  (the in-cluster S3 source)
#   2. "rclone-gdrive" (you create) — client_id, client_secret, token,
#                                      crypt_password, crypt_password2
#
# See README.md for the one-time OAuth dance + how to populate "rclone-gdrive".
# The rendered Secret (rclone-config) is mounted read-only into the CronJob.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-config
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rclone-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        rclone.conf: |
          [seaweedfs]
          type = s3
          provider = Other
          access_key_id = {{ .s3_access_key }}
          secret_access_key = {{ .s3_secret_key }}
          endpoint = http://seaweedfs-s3.monitoring:8333
          no_check_bucket = true

          [gdrive]
          type = drive
          # Your OWN OAuth client (rclone's shared client-id is being retired in
          # 2026). scope=drive gives full access; see README for the drive.file
          # least-privilege hardening option.
          scope = drive
          client_id = {{ .gdrive_client_id }}
          client_secret = {{ .gdrive_client_secret }}
          token = {{ .gdrive_token }}

          [gdrive-crypt]
          type = crypt
          remote = gdrive:homelab-backups
          # Both must be rclone-obscured strings (`rclone obscure <value>`).
          password = {{ .crypt_password }}
          password2 = {{ .crypt_password2 }}
          filename_encryption = standard
          directory_name_encryption = true
  data:
    - secretKey: s3_access_key
      remoteRef:
        key: "seaweedfs-s3"
        property: access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: "seaweedfs-s3"
        property: secret_key
    - secretKey: gdrive_client_id
      remoteRef:
        key: "rclone-gdrive"
        property: client_id
    - secretKey: gdrive_client_secret
      remoteRef:
        key: "rclone-gdrive"
        property: client_secret
    - secretKey: gdrive_token
      remoteRef:
        key: "rclone-gdrive"
        property: token
    - secretKey: crypt_password
      remoteRef:
        key: "rclone-gdrive"
        property: crypt_password
    - secretKey: crypt_password2
      remoteRef:
        key: "rclone-gdrive"
        property: crypt_password2
