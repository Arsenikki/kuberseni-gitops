version: "3"

vars:
  TALOS_DIR: "{{.ROOT_DIR}}/talos"
  TF_DIR: "{{.ROOT_DIR}}/terraform"
  TALOSCONFIG: "{{.TALOS_DIR}}/clusterconfig/talosconfig"
  CLUSTER_NAME:
    sh: yq '.clusterName' {{.TALOS_DIR}}/topf.yaml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Install all project dependencies via mise (with lockfile verification)
    cmds:
      - mise install --locked

  # ── Full lifecycle ────────────────────────────────────────────────────────

  up:
    desc: |
      Full cluster bootstrap — metal install approach:
        1. Provision VMs (boots from Talos ISO into maintenance mode)
        2. Apply Talos configs with topf (nodes install to disk with A/B layout, reboot)
        3. (configs are rendered by topf from infra/talos/topf.yaml + patch folders)
        4. Bootstrap etcd + fetch kubeconfig
        5. Remove ISO from VMs (boot from disk from now on)
        6. Bootstrap ArgoCD + apps
    cmds:
      - task: terraform:apply
      - task: talos:apply-controlplane
      - task: talos:bootstrap
      - task: talos:apply-workers
      - task: talos:kubeconfig
      - task: argocd:bootstrap

  down:
    desc: Destroy all Proxmox VMs (data loss — use with care)
    prompt: This destroys ALL cluster VMs. Are you sure?
    cmds:
      - task: terraform:destroy

  # ── ArgoCD bootstrap ──────────────────────────────────────────────────────

  argocd:bootstrap:
    desc: Bootstrap ArgoCD, ESO, 1Password Connect and apply root Application
    cmds:
      - bash {{.ROOT_DIR}}/scripts/bootstrap-cluster.sh

  argocd:password:
    desc: Print the initial ArgoCD admin password
    cmds:
      - kubectl --context admin@kuberseni get secret argocd-initial-admin-secret -n argocd -o jsonpath='{.data.password}' | base64 -d && echo

  argocd:port-forward:
    desc: Port-forward ArgoCD UI to localhost:8080
    cmds:
      - kubectl --context admin@kuberseni port-forward svc/argocd-server -n argocd 8080:443

  # ── Terraform ─────────────────────────────────────────────────────────────

  terraform:create-api-token:
    desc: Create Proxmox API token for Terraform (one-time setup)
    prompt: This will create a terraform@pve user and API token on Proxmox. Continue?
    vars:
      PROXMOX_HOST:
        sh: 'bash -c ''read -p "Proxmox host IP [192.168.1.10]: " host </dev/tty && echo "${host:-192.168.1.10}"'''
      SSH_KEY: '{{.SSH_KEY | default "~/.ssh/arsenikki"}}'
    cmds:
      - |
        echo "Creating Terraform user and API token on {{.PROXMOX_HOST}}..."
        ssh -i {{.SSH_KEY}} root@{{.PROXMOX_HOST}} 'bash -s' <<'EOF'
        set -e

        # Create terraform user if not exists
        if ! pveum user list | grep -q "terraform@pve"; then
          echo "Creating terraform@pve user..."
          pveum user add terraform@pve --comment "Terraform automation user"
        else
          echo "User terraform@pve already exists"
        fi

        # Delete old token if exists (to allow regeneration)
        if pveum user token list terraform@pve | grep -q "provider"; then
          echo "Removing old token..."
          pveum user token remove terraform@pve provider
        fi

        # Create API token with privilege separation disabled
        echo "Creating API token..."
        pveum user token add terraform@pve provider --privsep=0

        # Grant Administrator role
        echo "Granting permissions..."
        pveum aclmod / -user terraform@pve -role Administrator

        echo ""
        echo "✅ API token created successfully!"
        echo "Copy the token secret shown above - it won't be shown again"
        EOF
      - |
        echo ""
        echo "Update infra/terraform/terraform.tfvars with:"
        echo "  proxmox_endpoint  = \"https://{{.PROXMOX_HOST}}:8006/\""
        echo "  proxmox_api_token = \"terraform@pve!provider=<SECRET_FROM_ABOVE>\""

  terraform:init:
    desc: Initialise Terraform providers
    dir: "{{.TF_DIR}}"
    # State is encrypted (OpenTofu native encryption). The PBKDF2 passphrase
    # comes from encryption.sops.yaml (age-encrypted) and is injected via
    # TF_ENCRYPTION so it never lands in a committed .tf file.
    env: &tf_encryption
      TF_ENCRYPTION:
        sh: printf 'key_provider "pbkdf2" "state" { passphrase = "%s" }' "$(sops -d --extract '["tf_state_passphrase"]' {{.TF_DIR}}/encryption.sops.yaml)"
    cmds:
      - tofu init

  terraform:plan:
    desc: Plan Proxmox VM changes
    dir: "{{.TF_DIR}}"
    deps: [terraform:init]
    env: *tf_encryption
    cmds:
      - sops exec-file secrets.tfvars 'tofu plan -var-file={}'

  terraform:apply:
    desc: Provision Proxmox VMs
    dir: "{{.TF_DIR}}"
    deps: [terraform:init]
    env: *tf_encryption
    cmds:
      - sops exec-file secrets.tfvars 'tofu apply -var-file={} -auto-approve'

  terraform:destroy:
    desc: Destroy Proxmox VMs
    dir: "{{.TF_DIR}}"
    env: *tf_encryption
    cmds:
      - sops exec-file secrets.tfvars 'tofu destroy -var-file={} -auto-approve'


  # ── Talos (topf) ──────────────────────────────────────────────────────────
  # topf renders each node's machine config from talos/topf.yaml + the patch folders
  # (all/ -> control-plane/|worker/ -> node/<host>/) and the SOPS-encrypted secrets.yaml.
  # Output from topf is redacted by default; `talos:render` writes plaintext configs
  # (with secrets) to the git-ignored clusterconfig/ — never commit or paste them.

  talos:secrets:
    desc: Create the Talos secrets bundle (only if missing; SOPS-encrypts secrets.yaml on write)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf secrets > /dev/null
    status:
      - test -f secrets.yaml

  talos:render:
    desc: Render per-node machine configs to clusterconfig/ for inspection (contain secrets)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf render -o clusterconfig

  talos:talosconfig:
    desc: Write the talosctl client config to clusterconfig/talosconfig
    dir: "{{.TALOS_DIR}}"
    cmds:
      - mkdir -p clusterconfig
      - topf talosconfig > clusterconfig/talosconfig

  talos:diff:
    desc: Show what applying would change on each node (redacted; NODES=regex to filter)
    dir: "{{.TALOS_DIR}}"
    cmds:
      # exit code 2 = changes detected, which is not an error here
      - topf apply --dry-run {{if .NODES}}--nodes-filter '{{.NODES}}'{{end}} || [ $? -eq 2 ]

  talos:apply:
    desc: Apply config to running nodes (MODE=auto|no-reboot|staged|try, NODES=regex)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf apply --mode={{.MODE | default "auto"}} {{if .NODES}}--nodes-filter '{{.NODES}}'{{end}}

  talos:apply-controlplane:
    desc: Apply config to the control plane nodes (also works in maintenance mode, first install)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf apply --nodes-filter 'control-plane-.*'

  talos:apply-workers:
    desc: Apply config to the worker nodes (also works in maintenance mode, first install)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf apply --nodes-filter 'worker-.*'

  talos:bootstrap:
    desc: Bootstrap etcd on control-plane-01 (run once, after the first control-plane apply)
    deps: [talos:talosconfig]
    vars:
      CP1_IP:
        sh: yq '.nodes[] | select(.host == "control-plane-01") | .ip' {{.TALOS_DIR}}/topf.yaml
    cmds:
      - |
        echo "Waiting for control-plane-01 ({{.CP1_IP}}) to be ready for bootstrap..."
        until talosctl --talosconfig {{.TALOSCONFIG}} -n {{.CP1_IP}} version >/dev/null 2>&1; do
          sleep 5
        done
        echo "Bootstrapping etcd..."
        talosctl --talosconfig {{.TALOSCONFIG}} bootstrap --nodes {{.CP1_IP}}

  talos:kubeconfig:
    desc: Fetch kubeconfig and merge into ~/.kube/config
    deps: [talos:talosconfig]
    vars:
      CP1_IP:
        sh: yq '.nodes[] | select(.host == "control-plane-01") | .ip' {{.TALOS_DIR}}/topf.yaml
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} kubeconfig --nodes {{.CP1_IP}} --merge

  # topf upgrades control planes one at a time (etcd quorum), drains/uncordons each
  # node, and targets the installer image from the assembled config (schematic + version).
  talos:upgrade:
    desc: Upgrade Talos on all nodes to the installer image in the config (DRY=1 to preview)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf upgrade {{if .DRY}}--dry-run{{end}}

  talos:upgrade:node:
    desc: Upgrade Talos on a single node (HOSTNAME=control-plane-01)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf upgrade --nodes-filter '^{{.HOSTNAME}}$'
