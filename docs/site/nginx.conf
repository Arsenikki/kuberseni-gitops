server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Starlight emits directory-style pages (e.g. /cluster/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Long cache for hashed assets; HTML stays fresh.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
