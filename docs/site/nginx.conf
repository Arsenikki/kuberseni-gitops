server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Starlight emits directory-style pages (e.g. /cluster/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
        # HTML must always revalidate (via etag), so a redeploy that rotates the
        # hashed /_astro asset names never leaves a browser on stale HTML that
        # requests now-404 assets (which breaks client JS: search + mermaid).
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    # Long cache for hashed assets; HTML stays fresh.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
